   ${retired.map(([r,v])=>`${esc(r)} &middot; ${v}`).join(" &nbsp; ")}
   \u2014 ${rn===1?"this pick was":"these picks were"} made before the group narrowed to four regions,
   so ${retired.length>1?"they have":"it has"} no bubble on the map. Kept here rather than dropped or
   folded into "somewhere not on this list".</div>`;}
 const renamedN=codes.filter(c=>(c.rg||[]).some(r=>RENAMED[r])).length;
 if(renamedN) h+=`<p class="hint"><b>French Alps &amp; Vercors</b> was renamed
  <b>French Alps, Vercors &amp; Chartreuse</b>. ${renamedN===1?"One earlier answer is":`${renamedN} earlier answers are`}
  counted under the new label \u2014 same region, longer name.</p>`;
 const off=(rgT[OFFLIST]||0);
 if(off) h+=`<p class="hint"><b>${off}</b> of you picked <b>somewhere not on this list</b>.</p>`;
 const named=codes.filter(c=>c.rw&&String(c.rw).trim());
 if(named.length) h+=`<div class="card"><div class="ct">Named instead</div>
  <p>${named.map(c=>`<b>${esc(String(c.rw).trim())}</b> &mdash; ${esc(c.n||"anon")}`).join("<br>")}</p></div>`;
 else if(off) h+=`<p class="hint">Nobody wrote in where \u2014 worth asking.</p>`;

 /* The same four regions, against the three things you want at once.
    Which chart is the group's own answers and which brings in outside numbers is settled
    at the top of the section, before either is looked at - a reader who has already read
    the dots cannot be told afterwards what they meant. Keep it there, and keep it saying
    "two of its three axes": the third is rail time, and a claim that the whole triangle
    measures listings would put Vestland's local access under a label about the journey
    from home. The circle sizes are votes, in both charts. */
 h+=`<div class="chartwrap" style="margin-top:14px">${triSVG(rgT)}</div>
  <p class="hint">The two measured axes are <b>land &amp; space</b> and <b>affordable</b>:
  the average of 32 tracked listings as of 25 September, scored by the search's own cost
  model &mdash; French Alps 13, Vestland 9, Pyrenees 6, Italian Alps 4, so the averages do
  not rest on equal ground. <b>Easy to reach</b> is not one of them: it is rail hours from the Netherlands,
  about 7&frac12; to Grenoble and about 27 to Bergen. The listings score access
  <i>around</i> a house, which is a different question, so the two are kept apart. A dot's
  place is the balance between the three, not the level of any one. Two things to hold
  against it: the priorities behind those averages are four answers, not fifteen, and
  renovation is blank on all but one listing, so nearly every price shown is a floor.</p>`;

 /* ---------- pins: where inside the region, and how far apart ---------- */
 const pins=allPins(codes);
 if(pins.length){
  h+=`${sec("Where exactly")}
   <p class="hint">A region name can hide a large disagreement. This is the part worth arguing with.</p>`;
  const byRg={};pins.forEach(x=>{(byRg[x.rg]=byRg[x.rg]||[]).push(x);});
  Object.entries(byRg).sort((a,b)=>b[1].length-a[1].length).forEach(([rg,list])=>{
   let gap=0,pairs=0;
   for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){gap+=kmApart(list[i].p,list[j].p);pairs++;}
   const mean=pairs?Math.round(gap/pairs):0;
   h+=`<div class="res"${insAttr(rg,list.map(x=>[nameOf(x.i),PAL[x.i%PAL.length],
      subArea(x.p)||"pinned"]))}><div class="t"><b>${esc(rg)}</b>
     <em>${list.length} pin${list.length===1?"":"s"}${pairs?` &middot; ${mean} km apart${pairs>1?" on average":""}`:""}
     ${pairs&&mean>=150?` <span class="tag split">far apart</span>`:pairs&&mean<50?` <span class="tag agree">same place</span>`:""}</em></div>
    <div class="diffs">${list.map(x=>`<div class="dl"><span class="dv">
      <b style="color:${PAL[x.i%PAL.length]}">${esc(nameOf(x.i))}</b>
      ${subArea(x.p)?esc(subArea(x.p)):`${x.p[0].toFixed(2)}&#176;N, ${x.p[1].toFixed(2)}&#176;E`}
      </span></div>`).join("")}</div></div>`;});
  const far=(()=>{let m=null;
    for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++){
     if(pins[i].rg!==pins[j].rg)continue;          /* only inside one region name */
     if(pins[i].i===pins[j].i)continue;            /* and only between two people */
     const d=kmApart(pins[i].p,pins[j].p);if(!m||d>m.d)m={d:d,a:pins[i],b:pins[j]};}
    return m;})();
  if(far&&far.d>=150) h+=`<div class="card split"><div class="ct">Same word, different place</div>
   <p><b>${esc(nameOf(far.a.i))}</b> and <b>${esc(nameOf(far.b.i))}</b> both said
   <b>${esc(far.a.rg)}</b> and then put their pins ${Math.round(far.d)} km apart. On the tally above
   that reads as agreement. Worth settling which end you mean before anyone books a viewing.</p></div>`;
  const nopin=codes.filter(c=>!Object.keys(c.pn||{}).length).length;
  if(nopin) h+=`<p class="hint">${nopin} of you left the pin blank, which is a fair answer
   \u2014 it just means the region is as far as you have got.</p>`;
 }

 /* ---------- activities gradient ---------- */
 h+=`${sec("What has to be possible")}
  <p class="hint">Sorted by appetite. Solid is essential, pale is nice, red is ruled out.</p>`;
 const scored=[];
 ACTS.forEach(([g,items])=>items.forEach(([k,a])=>{
   const v=codes.map(c=>(c.a&&c.a[k])||0);
   const must=v.filter(x=>x===2).length,nice=v.filter(x=>x===1).length,no=v.filter(x=>x===3).length;
   scored.push({g,a,k,v,must,nice,no,score:must*2+nice-no});}));
 scored.sort((x,y)=>y.score-x.score||y.must-x.must);
 const live=scored.filter(o=>o.score>0||o.no);
 live.forEach(o=>{
  const tag=o.must===N?` <span class="tag agree">unanimous</span>`:(o.must&&o.no)?` <span class="tag split">contested</span>`:"";
  h+=`<div class="res"${insAttr(o.a,o.v.map((v,i)=>[nameOf(i),PAL[i%PAL.length],
    v===2?"essential":v===1?"nice to have":v===3?"ruled out":"neutral"]))}><div class="t"><b>${o.a}</b><em>${o.g}${tag}</em></div>
   <div class="stack">${o.v.map((v,i)=>`<span style="width:${(v===2?100:v===1?50:v===3?100:0)/N}%;
     background:${v===3?"rgba(124,46,62,.65)":PAL[i%PAL.length]};opacity:${v===1?.42:1}"></span>`).join("")}</div></div>`;});
 const dead=scored.filter(o=>o.score<=0&&!o.no);
 if(dead.length) h+=`<p class="hint" style="margin-top:12px"><b>Nobody asked for:</b> ${dead.map(o=>esc(o.a.toLowerCase())).join(", ")}.</p>`;

 /* ---------- tolerance strips ---------- */
 h+=`${sec("How much you can each take")}
  <p class="hint">One dot per person. Bunched means agreed; spread means somebody is compromising.</p>`;
 const bigN=N>6, dotR=N<=6?6.5:N<=10?5:4, perRow=N<=6?1:N<=10?2:3;
 TOL.forEach(([k,a,lo,hi])=>{
  const v=codes.map(c=>tov(c,k)), sp2=Math.max(...v)-Math.min(...v);
  const counts={};v.forEach(x=>counts[x]=(counts[x]||0)+1);
  const stackH=Math.ceil(Math.max(...Object.values(counts))/perRow);
  const SW=320,SH=26+stackH*(dotR*2+1.5)+16, base=SH-24;
  let st=`<svg viewBox="0 0 ${SW} ${SH}" class="chart" style="max-height:${SH*1.6}px" role="img" aria-label="${esc(a)}">`;
  st+=`<line x1="14" y1="${base}" x2="${SW-14}" y2="${base}" stroke="#131E1B" stroke-opacity=".14" stroke-width="2.5" stroke-linecap="round"/>`;
  for(let i=0;i<=4;i++){const x=14+(SW-28)*i/4;
   st+=`<circle cx="${x.toFixed(1)}" cy="${base}" r="1.6" fill="#131E1B" fill-opacity=".18"/>`;}
  const mean=v.reduce((p,q)=>p+q,0)/N, mx2=14+(SW-28)*mean/4;
  if(bigN)st+=`<line x1="${mx2.toFixed(1)}" y1="${base-6}" x2="${mx2.toFixed(1)}" y2="${base+6}"
   stroke="#131E1B" stroke-opacity=".4" stroke-width="1.5"/>`;
  const seen={};
  v.forEach((val,i)=>{const n=(seen[val]=(seen[val]||0)+1)-1;
   const row=Math.floor(n/perRow), col=n%perRow;
   const spread=perRow>1?(col-(perRow-1)/2)*(dotR*2+1):0;
   const x=14+(SW-28)*val/4+spread, y=base-row*(dotR*2+1.5);
   st+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${Math.max(dotR,8)}" fill="${PAL[i%PAL.length]}"
     fill-opacity=".9" stroke="#EAEDE8" stroke-width="1.2"${insAttr(a,v.map((vv,j)=>[nameOf(j),PAL[j%PAL.length],
      vv<=1?lo.toLowerCase():vv>=3?hi.toLowerCase():"middling"]))}><title>${esc(who(i))}</title></circle>`;
   if(!bigN)st+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#fff">${esc((who(i)[0]||"?").toUpperCase())}</text>`;});
  st+=`<text x="14" y="${SH-4}" font-family="ui-monospace,monospace" font-size="7.5" fill="#22423A" opacity=".65">${esc(lo)}</text>`;
  st+=`<text x="${SW-14}" y="${SH-4}" text-anchor="end" font-family="ui-monospace,monospace" font-size="7.5" fill="#22423A" opacity=".65">${esc(hi)}</text>`;
  st+=`</svg>`;
  h+=`<div class="res"><div class="t"><b>${a}</b><em>${sp2===0?`<span class="tag agree">identical</span>`:sp2>=3?`<span class="tag split">far apart</span>`:""}</em></div>${st}</div>`;});

 /* ---------- who is closest to whom ---------- */
 const TOLW={};TOL.forEach(([k,a,lo,hi])=>TOLW[k]=[lo,hi]);
 const feats=c=>{
  const f=[];
  SPEND.forEach(([k,a])=>f.push({k:"sp:"+k,label:a,raw:spv(c,k),norm:spv(c,k)/8,
    say:spv(c,k)+" token"+(spv(c,k)===1?"":"s")}));
  TOL.forEach(([k,a,lo,hi])=>{const v=tov(c,k);
    f.push({k:"to:"+k,label:a,raw:v,norm:v/4,say:v<=1?lo.toLowerCase():v>=3?hi.toLowerCase():"middling"});});
  ACTS.forEach(([g,items])=>items.forEach(([k,a])=>{const v=(c.a&&c.a[k])||0;
    f.push({k:"ac:"+k,label:a,raw:v,norm:v===2?1:v===1?.5:v===3?-.4:0,
      say:v===2?"essential":v===1?"nice":v===3?"ruled out":"neutral"});}));
  return f;};
 const FV=codes.map(feats);
 const dist=(i,j)=>Math.sqrt(FV[i].reduce((s,f,n)=>s+(f.norm-FV[j][n].norm)**2,0));
 let pairs=[],pairRow=null;
 if(N>=3){
  pairs=[];
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)pairs.push({i,j,d:dist(i,j)});
  pairs.sort((a,b)=>a.d-b.d);
  pairs.forEach((p,i)=>p.rank=i);
  const mxd=pairs[pairs.length-1].d||1;
  pairRow=p=>{
   const diffs=FV[p.i].map((f,n)=>({label:f.label,a:f.say,b:FV[p.j][n].say,gap:Math.abs(f.norm-FV[p.j][n].norm)}))
     .filter(d=>d.gap>0.001).sort((x,y)=>y.gap-x.gap).slice(0,3);
   const same=FV[p.i].map((f,n)=>({label:f.label,say:f.say,both:f.norm===FV[p.j][n].norm,strength:f.norm}))
     .filter(d=>d.both&&d.strength>=.5).sort((x,y)=>y.strength-x.strength).slice(0,2);
   return `<div class="res"><div class="t"><b>${esc(who(p.i))} &amp; ${esc(who(p.j))}</b>
     <em>${p.rank===0?"most alike":p.rank===pairs.length-1?"furthest apart":""}</em></div>
     <div class="bar"><span style="width:${(p.d/mxd*100).toFixed(0)}%;background:var(--gold)"></span></div>
     ${diffs.length?`<div class="diffs">${diffs.map(d=>`<div class="dl"><span class="dk">${esc(d.label)}</span>
       <span class="dv"><b style="color:${PAL[p.i%PAL.length]}">${esc(who(p.i))}</b> ${esc(d.a)}
       &nbsp;\u00b7&nbsp; <b style="color:${PAL[p.j%PAL.length]}">${esc(who(p.j))}</b> ${esc(d.b)}</span></div>`).join("")}
       ${same.length?`<div class="dl agreeln"><span class="dk">Both</span><span class="dv">${same.map(x=>esc(x.label.toLowerCase())+" \u2014 "+esc(x.say)).join("; ")}</span></div>`:""}
     </div>`:""}</div>`;};
  const PAIRCAP=8;
  const bigPairs=pairs.length>PAIRCAP*2;
  const shownPairs=bigPairs?[...pairs.slice(0,PAIRCAP),...pairs.slice(-PAIRCAP)]:pairs;
  h+=`${sec("Who is closest to whom")}
   <p class="hint">Shorter bar means more alike. Underneath each pair: the sharpest disagreements, ready-made
   for the conversation.${bigPairs?` ${pairs.length} pairs from ${N} people \u2014 showing the ${PAIRCAP} most alike and ${PAIRCAP} furthest apart.`:""}</p>`;
  h+=`<div id="pairsBox">${shownPairs.map(pairRow).join("")}</div>`;
  if(bigPairs)h+=`<button class="btn ghost noprint" id="pairsAll">Show all ${pairs.length} pairs</button>`;

  /* lone voices: where one person sits apart from everyone else */
  const lone=[];
  FV[0].forEach((_,n)=>{
   const v=FV.map(f=>f[n].norm);
   for(let i=0;i<N;i++){
    const others=v.filter((_,j)=>j!==i);
    if(others.every(o=>o===others[0]) && v[i]!==others[0]){
     lone.push({i,label:FV[i][n].label,mine:FV[i][n].say,
       theirs:FV[(i+1)%N][n].say,gap:Math.abs(v[i]-others[0])});}
   }});
  lone.sort((a,b)=>b.gap-a.gap);
  /* One person standing alone on six things is one finding, not six. Group by who they
     are and what the disagreement is, so the sentence is written once with a list. */
  const loneG={};
  lone.filter(x=>x.gap>=.25).forEach(x=>{
   const k=x.i+"|"+x.mine+"|"+x.theirs;
   (loneG[k]=loneG[k]||{i:x.i,mine:x.mine,theirs:x.theirs,gap:x.gap,labels:[]}).labels.push(x.label);
   loneG[k].gap=Math.max(loneG[k].gap,x.gap);});
  const top=Object.values(loneG).sort((a,b)=>b.labels.length-a.labels.length||b.gap-a.gap).slice(0,5);
  if(top.length){
   h+=`${sec("Lone voices")}
    <p class="hint">Where one of you sits apart from everyone else. Usually the most interesting thing here.</p>`;
   top.forEach(x=>{const many=x.labels.length>1;
    h+=`<div class="res"><div class="t">
      <b style="color:${PAL[x.i%PAL.length]}">${esc(who(x.i))}</b>
      <em>${many?`${x.labels.length} things`:""} alone</em></div>
      <p class="hint" style="margin:3px 0 0"><b>${esc(x.labels.map(l=>l.toLowerCase()).join(", "))}</b>
      &mdash; ${esc(x.mine)}, where everyone else says ${esc(x.theirs)}.</p></div>`;});
  }
 }

 /* ---------- shape, commitment, money ---------- */
 h+=sec("Shape &amp; commitment");
 STYLES.forEach(([k,a])=>{const n=codes.filter(c=>c.s===k).length;if(!n)return;
  h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.s===k?[nameOf(i),PAL[i%PAL.length],"chose this"]:null).filter(Boolean))}><div class="t"><b>${a}</b><em>${n}/${N}</em></div>
   <div class="bar"><span style="width:${n/N*100}%;background:var(--pine)"></span></div></div>`;});
 /* A blank shape now stays blank in the code rather than being written as "Separate
    houses", so it matches no bar - and the bars quietly summed to fewer than N with nothing
    saying where the rest went. Said, the way a retired region pick is. */
 {const noS=codes.filter(c=>!c.s);
  if(noS.length)h+=`<div class="res"${insAttr("Did not answer",
    noS.map(c=>{const i=codes.indexOf(c);return [nameOf(i),PAL[i%PAL.length],"no answer"];}))}>
   <div class="t"><b class="no">Did not answer</b><em>${noS.length}/${N}</em></div>
   <div class="bar"><span style="width:${noS.length/N*100}%;background:var(--rule)"></span></div></div>`;}
 USES.forEach(([k,a])=>{const n=codes.filter(c=>c.u===k).length;if(!n)return;
  h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.u===k?[nameOf(i),PAL[i%PAL.length],"chose this"]:null).filter(Boolean))}><div class="t"><b>${a}</b><em>${n}/${N}${n===N?` <span class="tag agree">all of you</span>`:""}</em></div>
   <div class="bar"><span style="width:${n/N*100}%;background:var(--glacier)"></span></div></div>`;});
 const hzs=codes.filter(c=>c.hz).length;
 if(hzs){h+=sec("When");
  const spanIdx=codes.filter(c=>c.hz).map(c=>HORIZON.findIndex(x=>x[0]===c.hz));
  const gap=Math.max(...spanIdx)-Math.min(...spanIdx);
  if(gap>=2)h+=`<div class="card split"><div class="ct">A gap worth naming</div>
   <p>Your timeframes are ${gap===3?"as far apart as they get":"a long way apart"}. Two people who agree on
   everything but disagree by five years are not building the same thing yet.</p></div>`;
  HORIZON.forEach(([k,a])=>{const n=codes.filter(c=>c.hz===k).length;if(!n)return;
   h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.hz===k?[nameOf(i),PAL[i%PAL.length],"this timeframe"]:null).filter(Boolean))}><div class="t"><b>${a}</b><em>${codes.filter(c=>c.hz===k).map(c=>esc(c.n||"anon")).join(", ")}</em></div>
    <div class="bar"><span style="width:${n/N*100}%;background:var(--gold)"></span></div></div>`;});}
 /* ---------- the trial year ---------- */
 const trAns=codes.filter(c=>c.tr&&c.tr!==TRIAL[0][0]);
 if(trAns.length){
  h+=`${sec("Renting together first")}
   <p class="hint">The proposal from the September call: a year living together somewhere before
   any money goes into land.</p>`;
  const yes=codes.filter(c=>c.tr==="must"||c.tr==="good").length;
  const no=codes.filter(c=>c.tr==="skip"||c.tr==="against").length;
  const hard=codes.filter(c=>c.tr==="must").length, anti=codes.filter(c=>c.tr==="against").length;
  if(hard&&anti) h+=`<div class="card split"><div class="ct">A straight conflict</div>
    <p>${hard} of you will not buy without a trial year and ${anti} ${anti===1?"is":"are"} against
    having one. That is not a preference to average out \u2014 settle it before anyone looks at
    property.</p></div>`;
  else if(yes&&!no&&trAns.length>1) h+=`<div class="card agree"><div class="ct">Settled, if you want it to be</div>
    <p>Everyone who answered is for it. The trial year can stop being a proposal and start being
    the plan.</p></div>`;
  TRIAL.forEach(([k,a])=>{const c2=codes.filter(c=>c.tr===k).length;if(!c2)return;
   h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.tr===k?[nameOf(i),PAL[i%PAL.length],"said this"]:null).filter(Boolean))}><div class="t"><b>${a}</b>
    <em>${codes.filter(c=>c.tr===k).map(c=>esc(c.n||"anon")).join(", ")}</em></div>
    <div class="bar"><span style="width:${c2/N*100}%;background:${k==="must"||k==="good"?"var(--glacier)":k==="unsure"?"var(--rule)":"var(--madder)"}"></span></div></div>`;});
 }
 const hhs=codes.filter(c=>c.hh).length;
 if(hhs){h+=sec("Who is coming");
  HOUSE.forEach(([k,a])=>{const n=codes.filter(c=>c.hh===k).length;if(!n)return;
   h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.hh===k?[nameOf(i),PAL[i%PAL.length],"yes"]:null).filter(Boolean))}><div class="t"><b>${a}</b><em>${n}/${N}</em></div>
    <div class="bar"><span style="width:${n/N*100}%;background:var(--pine)"></span></div></div>`;});
  const kid=codes.filter(c=>c.hh==="kids").length;
  if(kid)h+=`<p class="hint" style="margin-top:8px">${kid} of you would bring children, which puts
   school and hospital distance on the list.</p>`;}
 /* Passports and countries decide what is legally possible before any preference does, so
    this reports what was actually said and stays quiet about what it implies. */
 const from=codes.filter(c=>(c.cz&&c.cz.trim())||(c.lv&&c.lv.trim()));
 if(from.length){h+=`${sec("Where we are coming from")}
  <p class="hint">What is possible legally is decided by these before any preference on this
  page. ${from.length}/${N} answered.</p>`;
  from.forEach(c=>h+=`<div class="res"><div class="t"><b>${esc(c.n||"anon")}</b>
   <em>${esc([c.cz&&c.cz.trim(),c.lv&&c.lv.trim()?"in "+c.lv.trim():""].filter(Boolean).join(" \u00b7 "))}</em></div></div>`);
  const noCz=N-codes.filter(c=>c.cz&&c.cz.trim()).length;
  if(noCz)h+=`<p class="hint" style="margin-top:8px">${noCz} ${noCz===1?"has":"have"} not said,
   and every property outside Norway needs this settled before an offer.</p>`;}
 const skT=SKILLS.map(([k,a])=>({a,n:codes.filter(c=>c.sk&&c.sk[k]).length,
   who:codes.filter(c=>c.sk&&c.sk[k]).map(c=>c.n||"anon")})).sort((x,y)=>y.n-x.n);
 if(skT.some(x=>x.n)){h+=`${sec("What you bring")}
  <p class="hint">Covered ground and gaps. A gap is not a problem until you buy something that needs it.</p>`;
  skT.filter(x=>x.n).forEach(o=>h+=`<div class="res"${insAttr(o.a,o.who.map(nm=>{
    const i=codes.findIndex(c=>(c.n||"")===nm);return [nm,PAL[(i<0?0:i)%PAL.length],"can do this"];}))}><div class="t"><b>${o.a}</b>
    <em>${esc(o.who.join(", "))}</em></div>
    <div class="bar"><span style="width:${o.n/N*100}%;background:var(--pine)"></span></div></div>`);
  const gaps=skT.filter(x=>!x.n).map(x=>esc(x.a.toLowerCase()));
  if(gaps.length)h+=`<div class="card split"><div class="ct">Nobody has this yet</div>
    <p>${gaps.join(", ")}. Worth knowing before you need it.</p></div>`;}
 const whys=codes.filter(c=>c.wy&&c.wy.trim());
 if(whys.length){h+=sec("Why, in your own words");
  whys.forEach(c=>h+=`<div class="card"><div class="ct">${esc(c.n||"anon")}</div><p>${esc(c.wy)}</p></div>`);}
 const stops=codes.filter(c=>c.st&&c.st.trim());
 if(stops.length){h+=`${sec("What would stop you")}
  <p class="hint">Deal-breakers, in their own words. These outrank every preference on this page.</p>`;
  stops.forEach(c=>h+=`<div class="card split"><div class="ct">${esc(c.n||"anon")}</div><p>${esc(c.st)}</p></div>`);}
 /* Keyed off CAPEUR, not a bare index cutoff: the old "c.cp < 5" test would have counted
    the two appended top bands as "did not answer" and quietly left them out of the pool. */
 const said=codes.filter(c=>typeof c.cp==="number"&&CAPEUR[c.cp]);
 if(said.length){const lo=said.reduce((a,c)=>a+CAPEUR[c.cp][0],0),hi=said.reduce((a,c)=>a+CAPEUR[c.cp][1],0);
  h+=`<div class="res"><div class="t"><b>Pooled up-front capital</b><em>${said.length}/${N} answered</em></div>
   <p class="hint" style="margin:4px 0 0">Roughly &euro;${num(lo)}k&ndash;${num(hi)}k before borrowing. A house with land runs
   &euro;120k&ndash;1.2M depending on region, so this is ${hi<150?"early days":"a real start"}.</p></div>`;}
 const rs=codes.filter(c=>typeof c.rn==="number"&&RUNEUR[c.rn]);
 if(rs.length){const lo=rs.reduce((a,c)=>a+RUNEUR[c.rn][0],0),hi=rs.reduce((a,c)=>a+RUNEUR[c.rn][1],0);
  h+=`<div class="res"><div class="t"><b>Pooled monthly</b><em>${rs.length}/${N} answered</em></div>
   <p class="hint" style="margin:4px 0 0">About &euro;${num(lo)}&ndash;${num(hi)} a month between you.</p></div>`;}
 const splitBands=[];
 if(codes.some(c=>c.cp===CAPSPLIT))splitBands.push(`<b>${esc(CAP[CAPSPLIT])}</b> up front`);
 if(codes.some(c=>c.rn===RUNSPLIT))splitBands.push(`<b>${esc(RUN[RUNSPLIT])}</b> a month`);
 if(splitBands.length) h+=`<p class="hint">Some of you answered ${splitBands.join(" and ")},
  ${splitBands.length>1?"bands":"a band"} since split into narrower ones because most of the
  places actually found cost more than the old top band could describe. Counted here at the
  old range and shown as given, not moved into a band nobody picked \u2014 worth asking those
  people to answer again.</p>`;
 /* "no" used to be the remainder, so every code that carries no borrowing answer at all
    was reported to the group as a No. recBin now writes the spare 2-bit value 3 for a blank
    rather than inventing a Yes, and this is the other half of that: count the three answers
    and say how many did not give one, the way the pooled rows already say "12/15 answered".
    The money step will not let anyone past without answering, so a blank only arrives on an
    imported code or an old draft - which is exactly the case where inventing an answer for
    somebody who never gave one does the most damage. */
 const yes=codes.filter(c=>c.d==="Yes").length,mb=codes.filter(c=>c.d==="Maybe").length,
   nope=codes.filter(c=>c.d==="No").length, dunno=N-yes-mb-nope;
 h+=`<div class="res"><div class="t"><b>Would borrow</b><em>${yes} yes &middot; ${mb} maybe &middot; ${nope} no${dunno?` &middot; ${dunno} didn't say`:""}</em></div></div>`;

 /* ---------- write-ins ---------- */
 const own={};
 codes.forEach(c=>(c.ow||[]).forEach(x=>{const k=String(x).toLowerCase().trim();if(!k)return;
  if(!own[k])own[k]={label:x,n:0,who:[]};own[k].n++;own[k].who.push(c.n||"anon");}));
 const ow=Object.values(own).sort((a,b)=>b.n-a.n);
 if(ow.length){h+=sec("Added by hand");
  ow.forEach(o=>h+=`<div class="res"><div class="t"><b>${esc(o.label)}</b><em>${esc(o.who.join(", "))}${o.n>1?` <span class="tag agree">${o.n} of you</span>`:""}</em></div></div>`);}

 h+=`<p class="foot">A picture of where you are, not a decision. With only ${N} of you, read the labels as
  prompts rather than findings.</p>
  <button class="btn noprint" id="png">Make a shareable image</button>
  <button class="btn ghost noprint" id="more">Add more codes</button>
  <button class="btn ghost noprint" id="shr2">Show the shared code</button>
  <button class="btn ghost noprint" id="hm">Home</button>
  <div id="sharebox" class="noprint"></div>
  <button id="totop" class="noprint" aria-label="Back to top">&uarr;</button>`;
 const navHTML=secList.length?`<div class="secnav noprint">${secList.map(s=>`<a href="#${s.id}">${s.label}</a>`).join("")}</div>`:"";
 app.innerHTML=h.replace("__RADAR__",window.__radar(null)).replace("__SECNAV__",navHTML);
 const pairsAllBtn=document.getElementById("pairsAll");
 if(pairsAllBtn)pairsAllBtn.onclick=()=>{document.getElementById("pairsBox").innerHTML=pairs.map(pairRow).join("");pairsAllBtn.remove();};
 const totop=document.getElementById("totop");
 if(totop)totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
 /* One scroll listener for the whole page: it shows the back-to-top button once there is
    something to go back up to, and marks which section you are in. Twenty-odd screens with
    a sixteen-chip strip is otherwise impossible to place yourself in. The previous listener
    is always removed first - result() re-renders, and two of these would fight. */
 (function(){
  if(window.__navScroll)window.removeEventListener("scroll",window.__navScroll);
  const nav=document.querySelector(".secnav");
  const links=nav?[...nav.querySelectorAll("a")]:[];
  const secs=links.map(a=>document.getElementById(a.getAttribute("href").slice(1)));
  let queued=false, cur=-1;
  const paint=()=>{
   queued=false;
   if(totop)totop.classList.toggle("on",window.scrollY>600);
   if(!links.length)return;
   /* The last heading to have passed under the strip is the one you are reading. Above the
      first of them nothing is marked - marking a section you have not reached yet is a
      small lie, and it made the strip jump on first paint. */
   let i=-1;
   for(let k=0;k<secs.length;k++){
    if(secs[k]&&secs[k].getBoundingClientRect().top<=64)i=k; else break;
   }
   if(i===cur)return;
   cur=i;
   links.forEach((a,k)=>a.classList.toggle("on",k===i));
   if(i<0)return;
   /* keep the marked chip in view without dragging the page around it */
   const a=links[i], l=a.offsetLeft, r=l+a.offsetWidth;
   if(l<nav.scrollLeft+12)nav.scrollTo({left:Math.max(0,l-12),behavior:"smooth"});
   else if(r>nav.scrollLeft+nav.clientWidth-12)
    nav.scrollTo({left:r-nav.clientWidth+12,behavior:"smooth"});
  };
  window.__navScroll=()=>{if(!queued){queued=true;requestAnimationFrame(paint);}};
  window.addEventListener("scroll",window.__navScroll,{passive:true});
  paint();
 })();
 (function(){let act=null;
  document.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{
   const v=b.dataset.pp;
   act=(v==="all")?null:(act&&act.size===1&&act.has(+v))?null:new Set([+v]);
   document.getElementById("radarbox").innerHTML=window.__radar(act);wireInspector();
   document.querySelectorAll("[data-pp]").forEach(x=>{
    if(x.dataset.pp==="all")x.classList.toggle("on",act===null);
    else x.classList.toggle("on",act===null||act.has(+x.dataset.pp));});});})();
 document.getElementById("more").onclick=()=>{mode="combine";window.scrollTo(0,0);render();};
 POSTER={score:SCORE,verdict:verdict,names:codes.map((c,i)=>who(i)),
  sections:secLive.slice().sort((a,b)=>b[1]-a[1]).map(([l,v])=>[l,Math.round(v*100)]),
  locked:locked.slice(0,6).map(p=>p.label),fight:fight.slice(0,6).map(p=>p.label),
  regions:Object.entries(tally(rgOf)).sort((a,b)=>b[1]-a[1])
    .map(([r,n])=>r+" \u2014 "+n+(RETIRED.indexOf(r)>=0?" (earlier list)":""))
    .concat(codes.filter(c=>c.rw&&String(c.rw).trim())
      .map(c=>"\u201c"+String(c.rw).trim()+"\u201d \u2014 "+(c.n||"anon"))),
  pins:allPins(codes).map(x=>nameOf(x.i)+" \u2014 "+(subArea(x.p)||x.rg)),
  trial:(()=>{const t=codes.filter(c=>c.tr&&c.tr!==TRIAL[0][0]);
    if(!t.length)return [];
    return TRIAL.slice(1).map(([k,a])=>{const c2=codes.filter(c=>c.tr===k).length;
      return c2?a+" \u2014 "+c2:null;}).filter(Boolean);})(),
  stops:codes.filter(c=>c.st&&c.st.trim()).map(c=>(c.n||"anon")+": "+c.st)};
 wireInspector();
 const tip1=document.querySelector("#app .res[data-items]");
 if(tip1)tip1.classList.add("tip1");
 document.querySelectorAll(".qdot").forEach(d=>{const prev=d.onclick;
  d.onclick=ev=>{const q=window.__qp[+d.dataset.qi];
   if(q)document.getElementById("qcap").innerHTML=`<b>${esc(q.label)}</b> &mdash; ${q.want}% wanted, ${q.agree}% agreed
    &middot; <span style="color:${q.zone==="could be's"?"#7C2E3E":q.zone==="locked in"?"#35748A":"#22423A"}">${q.zone}</span>`;
   if(prev)prev.call(d,ev);};});
 document.getElementById("png").onclick=()=>{const b=document.getElementById("png");
  b.textContent="Drawing\u2026";
  makePoster((kind,src)=>{
   b.textContent="Make a shareable image";
   const box=document.getElementById("sharebox");
   box.innerHTML=`<p class="hint" style="margin:16px 0 8px"><b>Press and hold the image</b> to save it or send
    it straight to WhatsApp. On a laptop, right-click and Save image.</p>
    <img class="poster" src="${src}" alt="Where we stand \u2014 summary">
    <a class="btn ghost" href="${src}" download="where-we-stand.${kind}" target="_blank" rel="noopener">Open it full size</a>`;
   box.scrollIntoView({behavior:"smooth",block:"start"});});};
 document.getElementById("shr2").onclick=()=>{const pk=encode(codes);
  const box=document.getElementById("sharebox");
  box.innerHTML=`<p class="hint" style="margin:14px 0 6px">One code holding all ${N} answers. Anyone who pastes
   it into <b>Combine</b> sees this exact page. Sending it through a chat app is fine \u2014 the spaces below
   are ignored when it's pasted back in.</p>
   <div class="code" id="pk">${esc(grp(pk))}</div><button class="btn ghost" id="pkcp">Copy it</button>`;
  document.getElementById("pkcp").onclick=()=>{
   const el=document.getElementById("pk");
   try{navigator.clipboard.writeText(grp(pk)).then(()=>{document.getElementById("pkcp").textContent="Copied";},()=>{});}catch(e){}
   try{const r=document.createRange();r.selectNodeContents(el);
    getSelection().removeAllRanges();getSelection().addRange(r);}catch(e){}};
  box.scrollIntoView({behavior:"smooth",block:"nearest"});};
 upgradeMap(tally(rgOf));
 document.getElementById("hm").onclick=()=>{mode="home";render();};
}
/* open a shared link straight into that person's answers */
(function boot(){
 const m=location.hash.match(/#c=(.+)$/);
 if(m){try{const o0=decode(m[1]);
  if(Array.isArray(o0)&&o0.length>1){codes=o0;mode="result";render();return;}
  const o=Array.isArray(o0)?o0[0]:o0;
  S=stateFrom(o);
  window.__incoming=o; autosave(); mode="incoming"; render(); return;}catch(e){}}
 render();
})();
</script>
