<meta charset="utf-8">

<title>Build your commons</title>
<style>
html{color-scheme:light;background:#EAEDE8;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{color-scheme:light only;
 --paper:#EAEDE8; --ink:#131E1B; --pine:#22423A; --glacier:#35748A; --madder:#7C2E3E;
 --gold:#8A6A2F; --rule:rgba(19,30,27,.16); --rule2:rgba(19,30,27,.07);
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
#app{max-width:620px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.08;margin:0 0 6px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.15;margin:0 0 4px}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pine);opacity:.7;margin-bottom:14px}
.lede{font-size:16px;color:var(--pine);margin:0 0 20px}
.hint{font-size:13.5px;color:var(--pine);opacity:.8;margin:0 0 16px}
.note{background:rgba(53,116,138,.09);border-left:2px solid var(--glacier);padding:12px 14px;
 font-size:13.5px;line-height:1.5;margin:0 0 18px;border-radius:0 3px 3px 0}
.note b{font-weight:600}
.note .row{display:block;margin:11px 0 0}
.note .clim{display:block;margin:2px 0 0;font-size:12px;opacity:.82;line-height:1.45}
.note .cmp{opacity:.5}
.note .cmphead{display:block;margin:16px 0 2px;padding-top:11px;border-top:1px solid var(--rule);
 font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.7}
.note .tail{display:block;margin:15px 0 0;padding-top:11px;border-top:1px solid var(--rule)}
.note .src{display:block;margin:9px 0 0;font-size:11px;opacity:.6;line-height:1.45}
.retired{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--rule);background:rgba(19,30,27,.035);
 border-radius:0 3px 3px 0;font-size:12.5px;color:var(--pine);opacity:.85;line-height:1.5}
.retired b{font-weight:600}
button{font-family:var(--sans);cursor:pointer;border-radius:3px;transition:.12s}
.btn{display:block;width:100%;padding:14px 16px;font-size:16px;background:var(--pine);color:var(--paper);border:none;margin-top:10px}
.btn:hover{background:#1a352e}
.btn.ghost{background:none;color:var(--pine);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--pine)}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;background:rgba(255,255,255,.5);
 border:1px solid var(--rule);color:var(--ink);font-size:15.5px;line-height:1.35}
.opt:hover{border-color:var(--pine)}
.opt.on{background:var(--pine);color:var(--paper);border-color:var(--pine)}
.opt small{display:block;font-size:12.5px;opacity:.75;margin-top:2px}
.tok{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.tok .lb{flex:1;font-size:15px}
.tok .lb small{display:block;font-size:12px;color:var(--pine);opacity:.7}
.tok .pips{font-family:var(--mono);font-size:13px;color:var(--glacier);min-width:60px;text-align:right;letter-spacing:1px}
.tok button{width:36px;height:36px;font-size:18px;background:none;border:1px solid var(--rule);color:var(--pine);line-height:1}
.tok button:disabled{opacity:.22;cursor:default}
.bank{position:sticky;top:0;background:var(--paper);padding:11px 0;font-family:var(--mono);font-size:12.5px;
 letter-spacing:.06em;color:var(--pine);border-bottom:1px solid var(--rule);z-index:5}
.bank b{color:var(--madder);font-size:15px}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--pine);
 opacity:.65;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;font-size:14px;border:1px solid var(--rule);background:rgba(255,255,255,.5);color:var(--ink)}
.chip.nice{background:rgba(53,116,138,.16);border-color:var(--glacier)}
.chip.must{background:var(--glacier);border-color:var(--glacier);color:#fff}
.chip.no{opacity:.45;border-style:dashed;border-color:var(--madder);text-decoration:line-through}
.key{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--pine);opacity:.8;margin:14px 0 0}
.sl{margin:16px 0 20px}
.sl label{display:block;font-size:15px;margin-bottom:2px}
.sl .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--pine);opacity:.7;margin-top:3px}
input[type=range]{width:100%;accent-color:var(--pine)}
input[type=text],textarea{width:100%;padding:12px;font-size:16px;font-family:var(--sans);background:rgba(255,255,255,.7);
 border:1px solid var(--rule);border-radius:3px;color:var(--ink)}
textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical}
.dots{display:flex;gap:5px;margin-bottom:18px}
.dots i{height:3px;flex:1;background:var(--rule);border-radius:2px}
.dots i.on{background:var(--pine)}
.code{font-family:var(--mono);font-size:14px;word-break:break-all;background:rgba(255,255,255,.8);
 border:1px solid var(--glacier);padding:14px;border-radius:3px;margin:14px 0;line-height:1.6;
 user-select:all;-webkit-user-select:all}
.bar{height:8px;background:var(--rule2);border-radius:4px;overflow:hidden;display:flex;margin-top:5px}
.bar span{display:block;height:8px}
.res{padding:13px 0;border-bottom:1px solid var(--rule2)}
.res .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res .t b{font-weight:500;font-size:15.5px}
.res .t em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--pine);opacity:.75}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
 padding:2px 7px;border-radius:2px;margin-left:6px}
.tag.agree{background:rgba(34,66,58,.14);color:var(--pine)}
.tag.split{background:rgba(124,46,62,.14);color:var(--madder)}
.sec{margin:30px 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--pine);opacity:.7;padding-bottom:6px;border-bottom:1px solid var(--rule);scroll-margin-top:50px}
.who{font-family:var(--mono);font-size:11.5px;color:var(--pine);opacity:.8;margin-bottom:16px}
.secnav{position:sticky;top:0;z-index:4;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
 white-space:nowrap;background:var(--paper);padding:9px 0;margin:16px 0 6px;border-bottom:1px solid var(--rule)}
.secnav a{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--pine);
 text-decoration:none;padding:6px 11px;border:1px solid var(--rule);border-radius:20px;background:rgba(255,255,255,.6)}
.secnav a:active,.secnav a:hover{border-color:var(--pine)}
#totop{position:fixed;right:14px;bottom:18px;width:42px;height:42px;border-radius:50%;background:var(--pine);
 color:var(--paper);border:none;font-size:15px;box-shadow:0 2px 12px rgba(19,30,27,.28);z-index:50}
/* Only the first inspectable row on the page carries the hint; repeating it under every
   row printed the same three words seventy times. */
.res.tip1::after{content:"tap for names";display:block;font-family:var(--mono);font-size:9.5px;
 letter-spacing:.08em;text-transform:uppercase;color:var(--glacier);opacity:.55;margin-top:5px}
.stepbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px 12px;margin-bottom:10px}
.stepbar .whois{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--pine);opacity:.75;
 display:flex;align-items:center;gap:8px;min-width:0}
.stepbar .whois b{font-weight:600;color:var(--ink);opacity:1;text-transform:none;letter-spacing:0;
 font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:11em}
.stepbar .whois .onboard{flex:none;padding:1px 6px;border:1px solid var(--rule);border-radius:2px;
 font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--glacier);opacity:.9}
.stepbar .exit{background:none;border:none;color:var(--pine);font-family:var(--mono);font-size:12px;
 letter-spacing:.04em;padding:4px 0;opacity:.75;cursor:pointer}
.stepbar .exit:hover{opacity:1;text-decoration:underline}
.stepbar .stepno{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--pine);opacity:.6}
.err{color:var(--madder);font-size:13.5px;margin-top:8px}
.ok{color:var(--pine);font-size:13.5px;margin-top:8px}
.foot{margin-top:26px;font-size:12.5px;color:var(--pine);opacity:.75;line-height:1.5}

.card{border-left:2px solid var(--pine);background:rgba(255,255,255,.55);padding:11px 13px;margin:0 0 9px;border-radius:0 3px 3px 0}
.card.split{border-left-color:var(--madder)}
.card.agree{border-left-color:var(--glacier)}
.card .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.card p{margin:0;font-size:14.5px;line-height:1.45}
.board{border:1px solid var(--rule);border-radius:3px;background:rgba(255,255,255,.5);margin:0 0 14px;overflow:hidden}
.brow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule2)}
.brow:last-child{border-bottom:none}
.bn{flex:1;font-size:15px}
.brow .x{width:30px;height:30px;background:none;border:1px solid var(--rule);color:var(--madder);font-size:16px;line-height:1}
.brow .bedit{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
 background:none;border:none;padding:7px 0;text-align:left;color:var(--ink);font-size:15px;
 font-family:var(--sans);cursor:pointer}
.brow .bedit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bedit em{flex:none;font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--pine);opacity:.5}
.brow .bedit:hover em{opacity:1;text-decoration:underline}
.chartwrap{border:1px solid var(--rule);background:rgba(255,255,255,.45);border-radius:3px;padding:6px;margin:0 0 16px}
.pinbox{border:1px solid var(--rule);background:rgba(255,255,255,.5);border-radius:3px;
 padding:11px 12px 9px;margin:0 0 10px}
.pinbox .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.pinbox .ph b{font-size:14.5px;font-weight:600}
.pinbox .ph em{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--pine);opacity:.55}
.pinbox p.sub{margin:0 0 8px;font-size:12.5px;color:var(--pine);opacity:.8;line-height:1.45}
.pinmap{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation;
 background:rgba(255,255,255,.6);border:1px solid var(--rule2);border-radius:2px}
.pinbox .pf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
.pinbox .pf span{font-size:12.5px;color:var(--ink);min-width:0}
.pinbox .pf span b{font-weight:600}
.pinbox .pf button{flex:none;background:none;border:1px solid var(--rule);color:var(--pine);
 font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px}
.pinbox .pf button:hover{border-color:var(--pine)}
.chart{display:block;width:100%;height:auto}
.insp{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--pine);
 box-shadow:0 -6px 24px rgba(19,30,27,.14);padding:12px 16px 20px;max-height:52vh;overflow:auto;z-index:60;
 transform:translateY(110%);transition:transform .18s ease}
.insp.open{transform:translateY(0)}
.insp .ihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.insp .ihead b{font-family:var(--serif);font-size:18px;font-weight:500}
.insp #iclose{background:none;border:1px solid var(--rule);color:var(--pine);width:32px;height:32px;font-size:18px;line-height:1}
.irow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule2)}
.irow:last-child{border-bottom:none}
.idot{width:11px;height:11px;border-radius:50%;flex:none}
.iname{flex:1;font-size:15px}
.ival{font-family:var(--mono);font-size:12px;color:var(--pine)}
.res[data-items]:active{background:rgba(53,116,138,.08)}
.poster{display:block;width:100%;max-width:420px;margin:10px auto 12px;border:1px solid var(--rule);border-radius:3px}
.qcap{font-size:13px;color:var(--pine);background:rgba(255,255,255,.5);border:1px solid var(--rule);
 border-radius:3px;padding:9px 11px;margin:-10px 0 16px;min-height:38px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pchip{padding:7px 12px;font-size:13px;border:1px solid var(--rule);background:rgba(255,255,255,.5);color:var(--pine);border-radius:20px}
.pchip.on{background:var(--pc,var(--pine));border-color:var(--pc,var(--pine));color:#fff}
.pchip.alt{--pc:#131E1B}
.qkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px}
.qk{display:flex;align-items:center;gap:6px;font-size:12.5px}
.qn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
 color:#fff;font-family:var(--mono);font-size:9.5px}
@media print{
 .noprint,.pchips{display:none!important}
 #cm{max-width:none;padding:0}
 .res,.card,.chartwrap{break-inside:avoid}
 body{background:#fff}
}
.diffs{margin-top:8px;padding-left:10px;border-left:2px solid var(--rule)}
.dl{display:block;margin:5px 0;font-size:12.5px;line-height:1.4}
.dl .dk{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--pine);opacity:.65}
.dl .dv{color:var(--ink);opacity:.9}
.dl.agreeln{opacity:.75}
.stack{display:flex;height:9px;margin-top:6px;background:var(--rule2);border-radius:5px;overflow:hidden}
.stack span{display:block;height:9px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

@media (prefers-color-scheme: dark){
  html,body{background:#EAEDE8 !important;color:#131E1B !important}
  input,textarea,select,button{color-scheme:light}
}

 const stepLa=(win.la1-win.la0)>4?2:1, stepLo=(win.lo1-win.lo0)>6?2:1;
 for(let la=Math.ceil(win.la0);la<=win.la1;la+=stepLa){
  o+=`<line x1="${f.xy(la,win.lo0)[0].toFixed(1)}" y1="${f.xy(la,win.lo0)[1].toFixed(1)}"
   x2="${f.xy(la,win.lo1)[0].toFixed(1)}" y2="${f.xy(la,win.lo1)[1].toFixed(1)}"
   stroke="#131E1B" stroke-opacity=".07"/>`;}
 for(let lo=Math.ceil(win.lo0);lo<=win.lo1;lo+=stepLo){
  o+=`<line x1="${f.xy(win.la0,lo)[0].toFixed(1)}" y1="${f.xy(win.la0,lo)[1].toFixed(1)}"
   x2="${f.xy(win.la1,lo)[0].toFixed(1)}" y2="${f.xy(win.la1,lo)[1].toFixed(1)}"
   stroke="#131E1B" stroke-opacity=".07"/>`;}
 MAPGEO.forEach(ln=>{
  const runs=[];let cur=[];
  ln.forEach(pt=>{
   const [la,lo]=pt;
   const near=la>win.la0-1&&la<win.la1+1&&lo>win.lo0-1&&lo<win.lo1+1;
   const jump=cur.length&&(Math.abs(la-cur[cur.length-1][0])>1.2||Math.abs(lo-cur[cur.length-1][1])>1.2);
   if(!near||jump){if(cur.length>2)runs.push(cur);cur=near?[pt]:[];}
   else cur.push(pt);});
  if(cur.length>2)runs.push(cur);
  runs.forEach(seg=>{o+=`<polyline points="${seg.map(([la,lo])=>P(la,lo)).join(" ")}" fill="none"
   stroke="#131E1B" stroke-opacity=".3" stroke-width="1" stroke-linejoin="round"/>`;});});
 (RCTOWN[rg]||[]).forEach(([nm,la,lo])=>{
  if(la<win.la0||la>win.la1||lo<win.lo0||lo>win.lo1)return;
  const q=f.xy(la,lo), right=q[0]>PINW*0.68;
  o+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.2" fill="#131E1B" fill-opacity=".38"/>
   <text x="${(q[0]+(right?-5:5)).toFixed(1)}" y="${(q[1]+3).toFixed(1)}"
    text-anchor="${right?"end":"start"}" font-family="ui-monospace,monospace"
    font-size="8" fill="#22423A" opacity=".65">${esc(nm)}</text>`;});
 if(p){const q=f.xy(p[0],p[1]);
  o+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="13" fill="#7C2E3E" fill-opacity=".16"/>
   <circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5.5" fill="#7C2E3E"
    stroke="#EAEDE8" stroke-width="1.5"/>`;}
 return o+`</svg>`;
}
function pinPicker(rg){
 const p=(S.pin||{})[rg], area=subArea(p);
 const known=!!RCWIN[rg];
 return `<div class="pinbox">
  <div class="ph"><b>Roughly where in ${esc(PINLABEL[rg]||"Europe")}?</b><em>optional</em></div>
  <p class="sub">${known?`Tap the map. It only has to be roughly right &mdash; enough to tell one end
   of the region from the other, which the name alone cannot.`:`Tap the map if you have somewhere
   in mind. Towns are there to steer by, not as suggestions.`}</p>
  ${pinSVG(rg)}
  <div class="pf"><span>${p?`${area?`<b>${esc(area)}</b> &middot; `:""}${p[0].toFixed(2)}&#176;N,
    ${p[1].toFixed(2)}&#176;E`:`Nothing placed yet.`}</span>
   ${p?`<button data-pinclr="${esc(rg)}">Clear</button>`:""}</div></div>`;
}

/* ---------- steps ---------- */
const STEPS=[
{t:"Who's this?",k:"A first name, so the group can see whose is whose \u2014 and so you can come back and edit later.",
 r:()=>`<input type="text" id="nm" value="${esc(S.n)}" placeholder="First name" autocomplete="given-name">
  <p class="hint" style="margin-top:14px">Your answers save on this device under this name. Nothing is uploaded anywhere.</p>`,
 save:()=>{S.n=(document.getElementById("nm").value||"").trim().slice(0,24); return S.n?null:"A name would help.";}},

{t:"What shape is it?",k:"Not where \u2014 what kind of place. Pick the one closest to how you picture it.",
 r:()=>STYLES.map(([k,a,b])=>`<button class="opt ${S.style===k?"on":""}" data-style="${k}">${a}<small>${b}</small></button>`).join(""),
 save:()=>S.style?null:"Pick one."},

{t:"Spend your twenty",k:"Twenty tokens, eight things worth having. You cannot have them all \u2014 that's the point.",
 r:()=>`<div class="bank">Tokens left: <b id="left">${BANK-spent()}</b> of ${BANK}</div>`+
  SPEND.map(([k,a,b])=>`<div class="tok">
   <button data-sp="${k}" data-d="-1" ${S.sp[k]<=0?"disabled":""}>&minus;</button>
   <div class="lb">${a}<small>${b}</small></div>
   <span class="pips">${"\u25CF".repeat(S.sp[k])||"\u00B7"}</span>
   <button data-sp="${k}" data-d="1" ${spent()>=BANK?"disabled":""}>+</button></div>`).join(""),
 save:()=>spent()===0?"Spend at least a few.":null},

{t:"What has to be possible?",k:"Tap once for nice to have, twice for essential. A third tap rules it out \u2014 only if you really mean it.",
 r:()=>ACTS.map(([g,items])=>`<div class="grp">${g}</div><div class="chips">`+
   items.map(([k,a])=>{const v=S.act[k];const c=v===1?"nice":v===2?"must":v===3?"no":"";
     return `<button class="chip ${c}" data-act="${k}">${a}</button>`;}).join("")+`</div>`).join("")+
  `<div class="key"><span>\u00b7 neutral</span><span>\u25e6 nice to have</span><span>\u25cf essential</span><span>\u2715 ruled out</span></div>
   <p class="hint" style="margin-top:12px">Leaving something neutral is fine. Most people rule out very little.</p>
   <div class="grp">Something we've missed?</div>
   <textarea id="own" placeholder="Add your own \u2014 one per line">${esc(S.ow||"")}</textarea>
   <p class="hint" style="margin-top:8px">These travel inside your code and show up in the group picture,
   so anything several of you add can go on the list properly next time.</p>`,
 save:()=>{grabOwn();return null;}},

{t:"How much can you take?",k:"Slide toward whichever end feels true.",
 r:()=>TOL.map(([k,a,lo,hi])=>`<div class="sl"><label>${a}</label>
   <input type="range" min="0" max="4" value="${S.tol[k]}" data-tol="${k}">
   <div class="ends"><span>${lo}</span><span>${hi}</span></div></div>`).join(""),
 save:()=>null},

{t:"How would you use it?",k:"Be honest rather than aspirational.",
 r:()=>USES.map(([k,a])=>`<button class="opt ${S.use===k?"on":""}" data-use="${k}">${a}</button>`).join("")+
  `<p class="hint" style="margin-top:20px"><b>Who would be coming with you?</b></p>`+
  HOUSE.map(([k,a])=>`<button class="opt ${S.hh===k?"on":""}" data-hh="${k}">${a}</button>`).join(""),
 save:()=>S.use?(S.hh?null:"And who is coming with you?"):"Pick one."},

{t:"When, and what would stop you",k:"Timing splits groups more often than taste does.",
 r:()=>`<div class="note"><b>Renting together first.</b> The idea that came out of the September call:
   live somewhere together for a year before any money goes into land. It was the strongest
   proposal in the room and nobody has actually been asked about it, so this is the question
   doing the most work on this page.</div>`+
  TRIAL.map(([k,a,b])=>`<button class="opt ${S.tr===k?"on":""}" data-tr="${k}">${a}<small>${b}</small></button>`).join("")+
  `<p class="hint" style="margin-top:20px"><b>Realistically, when?</b></p>`+
  HORIZON.map(([k,a])=>`<button class="opt ${S.hz===k?"on":""}" data-hz="${k}">${a}</button>`).join("")+
  `<p class="hint" style="margin-top:20px"><b>What would make you walk away?</b> One line. A job, a person,
   a place you cannot leave, a number you cannot reach. Deal-breakers are worth more than preferences.</p>
   <textarea id="stop" placeholder="Nothing yet, or... ">${esc(S.stop||"")}</textarea>`,
 save:()=>{const q=document.getElementById("stop");if(q)S.stop=q.value.slice(0,240);
  return S.hz?null:"Pick a rough timeframe.";}},

{t:"Money, roughly",k:"Two different things, often confused. Both are bands, not commitments.",
 r:()=>`<div class="note"><b>What the numbers mean.</b> Rough all-in cost of a house with some land, before
   renovation, and where each region's climate is heading. Orders of magnitude for calibration, not quotes,
   and the climate lines are direction of travel rather than forecasts.
   <span class="row"><b>Pyrenees</b> (Ari&egrave;ge, Hautes-Pyr&eacute;n&eacute;es) &middot; &euro;120&ndash;300k
    <span class="clim">Cheapest of the four per square metre &mdash; houses run about &euro;1,400/m&sup2; in
    Ari&egrave;ge. It also carries the strongest drying and heat signal of the four: about +1.2&#176;C in
    fifty years against 0.85&#176;C globally, half the glaciers gone, and less snow projected at every
    elevation.</span></span>
   <span class="row"><b>Italian Alps</b> &middot; &euro;100&ndash;450k in the western and eastern valleys,
    past &euro;600k in South Tyrol and the Dolomites
    <span class="clim">This region has to be narrowed before the number means anything. Piedmont and Friuli
    sit near &euro;1,600/m&sup2;; Trentino-Alto Adige averages about &euro;3,300/m&sup2;, but the province of
    Bolzano hit a record &euro;4,746/m&sup2; in August 2026 and the city is nearer &euro;4,900 &mdash; which
    puts the Dolomites in the same bracket as the German and Austrian Alps. Full alpine warming plus southern
    exposure, and water stress in the valleys.</span></span>
   <span class="row"><b>French Alps, Vercors &amp; Chartreuse</b> &middot; &euro;200&ndash;450k
    <span class="clim">Median around &euro;2,050/m&sup2; in the Vercors and &euro;2,210/m&sup2; in the
    Chartreuse. Full alpine warming: a rising snowline and drier summers, felt first at lower
    elevation.</span></span>
   <span class="row"><b>Vestland, Norway</b> &middot; &euro;215&ndash;520k
    <span class="clim">Building and renovation costs are the highest of the four. Wetter and milder, and the
    least exposed of the four to heat and drought &mdash; annual rainfall is projected up 5&ndash;30% by 2100
    and the growing season one to two months longer, with dark winters and a short season as the standing
    cost today.</span></span>
   <span class="cmphead">Not on the shortlist &middot; kept for comparison</span>
   <span class="row cmp"><b>Dolomites &amp; South Tyrol</b> &middot; &euro;600k and up
    <span class="clim">The expensive end of "Italian Alps", and the reason that name needs
    narrowing.</span></span>
   <span class="row cmp"><b>German &amp; Austrian northern Alps</b> &middot; &euro;600k&ndash;1.2M
    <span class="clim">Dropped on price in September. Houses in Tyrol average roughly &euro;4,800/m&sup2;.
    Left here because deleting the expensive end makes the other four look arbitrary.</span></span>
   <span class="tail">Renovation typically adds 30&ndash;100% on top &mdash; cheapest in France, dearest in
   Norway, where building costs are among Europe's highest. Take a mid-range example at &euro;500k all-in:
   five households means &euro;100k each, fifteen means &euro;33k each.</span>
   <span class="src">Prices: french-property.com, notaires de l'Is&egrave;re, immobiliare.it, idealista.it,
   ssb.no, Statistik Austria. Climate: CREA Mont-Blanc, Observatoire Pyr&eacute;n&eacute;en du Changement
   Climatique, Klima i Norge 2100.</span></div>
  <p class="hint"><b>1. Up-front capital</b> \u2014 a one-time contribution toward buying and fixing the place.</p>`+
  CAP.map((m,i)=>`<button class="opt ${S.cap===i?"on":""}" data-cap="${i}">${m}</button>`).join("")+
  `<p class="hint" style="margin-top:18px"><b>2. Monthly running cost</b> \u2014 your share of insurance, heating,
   maintenance, tax, repairs. This continues forever, and it is what usually breaks these projects.</p>`+
  RUN.map((m,i)=>`<button class="opt ${S.run===i?"on":""}" data-run="${i}">${m}</button>`).join("")+
  `<p class="hint" style="margin-top:18px"><b>3.</b> Would you borrow to take part?</p>`+
  ["Yes","Maybe","No"].map(d=>`<button class="opt ${S.debt===d?"on":""}" data-debt="${d}">${d}</button>`).join(""),
 save:()=>S.debt?null:"Answer the borrowing question too."},

{t:"What could you bring?",k:"Not what you own \u2014 what you can do. A commons runs on skills more than money.",
 r:()=>`<div class="chips">`+SKILLS.map(([k,a])=>
   `<button class="chip ${S.sk[k]?"must":""}" data-sk="${k}">${a}</button>`).join("")+`</div>
  `,
 save:()=>null},

{t:"Gut feeling on where",k:"Almost done. Pick up to two regions, without thinking too hard.",
 r:()=>{const stale=staleRg(),live=liveRg();
  return (stale.length?`<div class="note"><b>Your earlier ${stale.length>1?"picks have":"pick has"} gone from the list.</b>
    ${stale.map(x=>esc(x)).join(" and ")} ${stale.length>1?"are":"is"} not on the shortlist any more &mdash;
    the group narrowed to four regions on the September call, mostly on price. Choose again below;
    ${stale.length>1?"those picks":"that pick"} will not be carried into your code.</div>`:"")+
   REGIONS.map(p=>`<button class="opt ${live.indexOf(p)>=0?"on":""}" data-rg="${esc(p)}">${p}</button>`).join("")+
   (live.indexOf(OFFLIST)>=0?`<div class="sl" style="margin:10px 0 0">
     <label for="rgw"><b>Where were you thinking?</b></label>
     <input type="text" id="rgw" maxlength="60" value="${esc(S.rw||"")}" placeholder="Name the place">
     <p class="hint" style="margin:7px 0 0">Up to 60 characters. It travels inside your code, so the group
     can see what you had in mind.</p></div>`:"")+
   (live.length?`<div class="grp">Whereabouts, more precisely</div>
     <p class="hint" style="margin:0 0 10px">"Italian Alps" covers a third-of-the-price difference between
     its western and eastern ends, so a rough pin says more than the name does. Skip it if you have not
     got that far.</p>`+live.map(r=>pinPicker(r)).join(""):"");},
 save:()=>{grabOwn();
  /* Retired picks are kept only until the person has actually chosen again. Once they
     have a live pick, the warning has served its purpose and the stale one goes. */
  if(liveRg().length)S.rg=liveRg();
  return null;}},

{t:"Last one, and it's optional",k:"Nothing to do with the questions above \u2014 this one is about the whole idea.",
 r:()=>`<p class="hint"><b>In one line: why do you want this at all?</b><br><br>
   Skip it if you'd rather; nothing depends on it. If you do write something it gets quoted back to the group,
   and it tends to be the part people actually remember.</p>
   <textarea id="why" placeholder="Because...">${esc(S.why||"")}</textarea>`,
 save:()=>{const w=document.getElementById("why");if(w)S.why=w.value.slice(0,180);return null;}}
];

/* ---------- render ---------- */
function render(){
 if(mode==="home")return home();
 if(mode==="done")return done();
 if(mode==="combine")return combine();
 if(mode==="result")return result();
 if(mode==="resume")return resume();
 if(mode==="incoming")return incoming();
 const st=STEPS[step];
 app.innerHTML=`<div class="stepbar"><button class="exit" id="exit">&larr; Home</button>
  ${step>0&&S.n?`<span class="whois"><b>${esc(S.n)}</b>
    ${boardEdit>=0?`<span class="onboard">on the board</span>`:""}
    <button class="exit" id="notyou">${boardEdit>=0?"Back to the board":"Not you?"}</button></span>`:""}
   <span class="stepno">Step ${step+1} of ${STEPS.length}</span></div>
  <div class="dots">${STEPS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>
  <h2>${st.t}</h2><p class="lede">${st.k}</p>${st.r()}
  <button class="btn" id="next">${step===STEPS.length-1?"Get my code":"Next"}</button>
  ${step>0?`<button class="btn ghost" id="back">Back</button>`:""}
  <div class="err" id="err"></div>`;
 wire();
}
function wire(){
 const q=(s,f)=>document.querySelectorAll(s).forEach(f);
 q("[data-style]",b=>b.onclick=()=>{S.style=b.dataset.style;autosave();render();});
q("[data-use]",b=>b.onclick=()=>{S.use=b.dataset.use;autosave();render();});
 q("[data-hh]",b=>b.onclick=()=>{S.hh=b.dataset.hh;autosave();render();});
 q("[data-sk]",b=>b.onclick=()=>{S.sk[b.dataset.sk]=S.sk[b.dataset.sk]?0:1;autosave();render();});
 q("[data-hz]",b=>b.onclick=()=>{const t=document.getElementById("stop");if(t)S.stop=t.value.slice(0,240);
   S.hz=b.dataset.hz;autosave();render();});
 q("[data-tr]",b=>b.onclick=()=>{const t=document.getElementById("stop");if(t)S.stop=t.value.slice(0,240);
   S.tr=b.dataset.tr;autosave();render();});
 q("[data-cap]",b=>b.onclick=()=>{S.cap=+b.dataset.cap;autosave();render();});
 q("[data-run]",b=>b.onclick=()=>{S.run=+b.dataset.run;autosave();render();});
 q("[data-debt]",b=>b.onclick=()=>{S.debt=b.dataset.debt;autosave();render();});
 q("[data-act]",b=>b.onclick=()=>{grabOwn();const k=b.dataset.act;S.act[k]=(S.act[k]+1)%4;autosave();render();});
 q("[data-tol]",r=>r.oninput=()=>{S.tol[r.dataset.tol]=+r.value;autosave();});
 q("[data-pinrg]",sv=>sv.onclick=ev=>{
   const rg=sv.dataset.pinrg, win=RCWIN[rg]||MAPWIN, f=insetFit(win);
   const box=sv.getBoundingClientRect(); if(!box.width)return;
   const sc=box.width/PINW;                       /* viewBox units per CSS pixel */
   const ll=f.inv((ev.clientX-box.left)/sc,(ev.clientY-box.top)/sc);
   grabOwn();
   if(!S.pin)S.pin={};
   S.pin[rg]=[Math.round(ll[0]*1e4)/1e4,Math.round(ll[1]*1e4)/1e4];
   autosave();render();});
 q("[data-pinclr]",b=>b.onclick=()=>{grabOwn();if(S.pin)delete S.pin[b.dataset.pinclr];
   autosave();render();});
 q("[data-rg]",b=>b.onclick=()=>{grabOwn();const p=b.dataset.rg;
   if(S.rg.includes(p))S.rg=S.rg.filter(x=>x!==p); else if(liveRg().length<2)S.rg.push(p);
   autosave();render();});
 q("[data-sp]",b=>b.onclick=()=>{const k=b.dataset.sp,d=+b.dataset.d;
   const v=S.sp[k]+d; if(v<0||v>10||(d>0&&spent()>=BANK))return; S.sp[k]=v; autosave(); render();});
 const nx=document.getElementById("next");
 if(nx)nx.onclick=()=>{const e=STEPS[step].save&&STEPS[step].save();
   if(e){document.getElementById("err").textContent=e;return;}
   autosave();
   if(step===STEPS.length-1)mode="done"; else step++;
   window.scrollTo(0,0);render();};
 const bk=document.getElementById("back");
 if(bk)bk.onclick=()=>{grabOwn();autosave();step--;window.scrollTo(0,0);render();};
 const ex=document.getElementById("exit");
 if(ex)ex.onclick=()=>{grabOwn();autosave();mode="home";window.scrollTo(0,0);render();};
 /* Deliberately does NOT autosave: autosave() writes to slug(S.n), so someone who opened the
    wrong name and started answering would otherwise overwrite that person's saved draft. */
 const ny=document.getElementById("notyou");
 if(ny)ny.onclick=()=>{const toBoard=boardEdit>=0;
  boardEdit=-1;boardEditKey="";S=blank();step=0;mode=toBoard?"combine":"home";
  window.scrollTo(0,0);render();};
}
function home(){
 const saved=lsKeys();
 app.innerHTML=`<div class="kicker">A commons, in the making</div>
 <h1>A life with friends</h1>
 <p class="lede">Some of us have been talking about buying somewhere together \u2014 a shared place in the
 countryside, somewhere in Europe, to actually live in rather than visit. Before anyone argues about
 <em>where</em>, it seemed worth finding out what each of us is actually picturing.</p>
 <p class="lede">So: five minutes, on your own, no right answers. You build your own version \u2014 what shape it
 takes, what has to be possible there, what you could put in, when. At the end you get a short code.
 Send it back and we can see where we already agree and where we quietly don't.</p>
 <p class="lede">Answering does not commit you to anything. Saying "someday, no timeline" or naming a
 deal-breaker is just as useful as saying yes.</p>
 ${msg?`<div class="ok">${esc(msg)}</div>`:""}
 <button class="btn" id="start">Start building</button>
 ${saved.length?`<button class="btn ghost" id="res">Open or edit mine</button>`:""}
 <button class="btn ghost" id="comb">${boardGet().length?`The board (${boardGet().length})`:"Combine codes"}</button>
 <p class="foot">No account, no sign-in, nothing installed, nothing uploaded. Your answers are saved on this
 device under your name, so you can close the page and come back for your code later.</p>
 <p class="foot"><a href="where-we-landed.html" style="color:var(--pine)">Where we landed after the September
 call</a> &mdash; a short recap of what changed.</p>`;
 msg="";
 document.getElementById("start").onclick=()=>{boardEdit=-1;boardEditKey="";S=blank();mode="build";step=0;render();};
 const r=document.getElementById("res"); if(r)r.onclick=()=>{mode="resume";render();};
 document.getElementById("comb").onclick=()=>{mode="combine";render();};
}
function incoming(){
 const o=window.__incoming||{}; const b=boardGet();
 app.innerHTML=`<div class="kicker">Someone shared their answers</div>
 <h2>${esc(o.n||"Anonymous")}${(o.n||"").slice(-1)==="s"?"'":"'s"} version</h2>
 <p class="lede">This link holds one person's answers. What do you want to do with it?</p>
 <button class="btn" id="addb">Add ${esc(o.n||"them")} to the board${b.length?` (${b.length} there already)`:""}</button>
 <button class="btn ghost" id="mine">Open it as mine, and edit</button>
 <button class="btn ghost" id="hmx">Ignore it, start fresh</button>`;
 const clean=()=>{try{history.replaceState(null,"",location.pathname);}catch(e){}};
 document.getElementById("addb").onclick=()=>{const r=boardAdd([o]);
  msg=`${esc(o.n||"They")} ${r.updated?"updated":"added"}. ${r.total} on the board.`;
  clean();mode="combine";render();};
 document.getElementById("mine").onclick=()=>{boardEdit=-1;boardEditKey="";clean();mode="done";render();};
 document.getElementById("hmx").onclick=()=>{boardEdit=-1;boardEditKey="";S=blank();clean();mode="home";render();};
}
function resume(){
 const names=lsKeys().map(k=>{try{return JSON.parse(lsGet(k)).n;}catch(e){return null;}}).filter(Boolean);
 app.innerHTML=`<div class="kicker">Saved on this device</div><h2>Open your answers</h2>
 <p class="lede">Pick your name to see your code again, or to change anything.</p>
 ${names.map(n=>`<button class="opt" data-nm="${esc(n)}">${esc(n)}</button>`).join("")||`<p class="hint">Nothing saved here yet.</p>`}
 <button class="btn ghost" id="hm">Back</button>`;
 document.getElementById("hm").onclick=()=>{mode="home";render();};
 document.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>{

   Two of the three now come from the property tracker rather than from a reading here.
   They are the mean of the 28 live listings in the search, scored by that tracker's own
   cost model and axis formulas, grouped by region: French Alps 10, Vestland 9, Pyrenees
   6, Italian Alps 3. Both are rescaled across the four so the axis spans the range the
   regions actually differ over - the raw averages sit in a narrow band and would make the
   axis do nothing. Rescaling changes the spacing, never the order.

   LAND & SPACE is plot size and buildings, weighted as the tracker weights them. Raw
   averages: Pyrenees .82, French Alps .75, Italian Alps .73, Vestland .67. This axis used
   to say IN THE MOUNTAINS and was a judgment call; it is now measured, and it is measuring
   a different thing. Vestland sits lowest because its listings are small lots around
   Bergen - one 84 ha outlier does not lift a nine-listing mean.

   AFFORDABLE is the tracker's cost model on the as-financed basis. Raw averages: Italian
   Alps .78, Pyrenees .53, Vestland .52, French Alps .49. This corrected a real error here:
   the old weights had the Pyrenees as the cheap corner, and the listings do not agree -
   Pyrenees averages EUR 509,940 all-in against French Alps EUR 505,008, near enough the
   same, with Vestland at EUR 392,449 and the Italian Alps at EUR 275,400. Only Italy
   separates.

   EASY TO REACH is deliberately NOT from the listings, and the caption says so. It is rail
   hours from Amsterdam, the group's practical rail gateway, on the fastest service:
   Grenoble 7h30, Turin 9h40 (Amsterdam-Paris plus the reopened Frejus line), Toulouse 9h20
   fastest but 12h typical, Bergen about 27 hours across four countries with an overnight.
   Scored as 1/hours, normalised, because travel pain is not linear. The tracker has an
   axis called "connected", but it is 62% weighted on "near a city" and measures each
   house's local situation - Vestland's listings score best of the four on it, all being
   near Bergen. Under this label that would read as Norway being the easy one to get to
   from the Netherlands, which is false. So the two are kept apart.

  const qitems=(p.kind==="act")

   : codes.map((c,i)=>[nameOf(i),PAL[i%PAL.length],((c.sp&&c.sp[p.key])||0)+" tokens"]);
  quad+=`<circle class="qdot" data-qi="${qi}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"

 quad+=`<text x="${(ql+(QW-ql-qr)/2).toFixed(0)}" y="${QH-8}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#22423A" opacity=".6">how much you want it &#8594;</text>`;
 quad+=`<text transform="translate(11,${(qt+(QH-qt-qb)/2).toFixed(0)}) rotate(-90)" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#22423A" opacity=".6">how much you agree &#8594;</text>`;

 h+=`${sec("The whole picture in one chart")}

 /* ---------- pins: where inside the region, and how far apart ---------- */
 const pins=allPins(codes);
 if(pins.length){

 /* ---------- who is closest to whom ---------- */
 const TOLW={};TOL.forEach(([k,a,lo,hi])=>TOLW[k]=[lo,hi]);
 const feats=c=>{
  const f=[];
  SPEND.forEach(([k,a])=>f.push({k:"sp:"+k,label:a,raw:spv(c,k),norm:spv(c,k)/8,
    say:spv(c,k)+" token"+(spv(c,k)===1?"":"s")}));
  TOL.forEach(([k,a,lo,hi])=>{const v=tov(c,k);

  ACTS.forEach(([g,items])=>items.forEach(([k,a])=>{const v=(c.a&&c.a[k])||0;
    f.push({k:"ac:"+k,label:a,raw:v,norm:v===2?1:v===1?.5:v===3?-.4:0,
      say:v===2?"essential":v===1?"nice":v===3?"ruled out":"neutral"});}));

 const dist=(i,j)=>Math.sqrt(FV[i].reduce((s,f,n)=>s+(f.norm-FV[j][n].norm)**2,0));
 let pairs=[],pairRow=null;
 if(N>=3){
  pairs=[];
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)pairs.push({i,j,d:dist(i,j)});
  pairs.sort((a,b)=>a.d-b.d);

  const mxd=pairs[pairs.length-1].d||1;
  pairRow=p=>{
   const diffs=FV[p.i].map((f,n)=>({label:f.label,a:f.say,b:FV[p.j][n].say,gap:Math.abs(f.norm-FV[p.j][n].norm)}))
     .filter(d=>d.gap>0.001).sort((x,y)=>y.gap-x.gap).slice(0,3);
   const same=FV[p.i].map((f,n)=>({label:f.label,say:f.say,both:f.norm===FV[p.j][n].norm,strength:f.norm}))

   loneG[k].gap=Math.max(loneG[k].gap,x.gap);});
  const top=Object.values(loneG).sort((a,b)=>b.labels.length-a.labels.length||b.gap-a.gap).slice(0,5);

  }

 if(trAns.length){

  if(hard&&anti) h+=`<div class="card split"><div class="ct">A straight conflict</div>
    <p>${hard} of you will not buy without a trial year and ${anti} ${anti===1?"is":"are"} against
    having one. That is not a preference to average out \u2014 settle it before anyone looks at
    property.</p></div>`;
  else if(yes&&!no&&trAns.length>1) h+=`<div class="card agree"><div class="ct">Settled, if you want it to be</div>
    <p>Everyone who answered is for it. The trial year can stop being a proposal and start being
    the plan.</p></div>`;
  TRIAL.forEach(([k,a])=>{const c2=codes.filter(c=>c.tr===k).length;if(!c2)return;
   h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.tr===k?[nameOf(i),PAL[i%PAL.length],"said this"]:null).filter(Boolean))}><div class="t"><b>${a}</b>
    <em>${codes.filter(c=>c.tr===k).map(c=>esc(c.n||"anon")).join(", ")}</em></div>
    <div class="bar"><span style="width:${c2/N*100}%;background:${k==="must"||k==="good"?"var(--glacier)":k==="unsure"?"var(--rule)":"var(--madder)"}"></span></div></div>`;});
 }
 const hhs=codes.filter(c=>c.hh).length;
 if(hhs){h+=sec("Who is coming");
  HOUSE.forEach(([k,a])=>{const n=codes.filter(c=>c.hh===k).length;if(!n)return;
   h+=`<div class="res"${insAttr(a,codes.map((c,i)=>c.hh===k?[nameOf(i),PAL[i%PAL.length],"yes"]:null).filter(Boolean))}><div class="t"><b>${a}</b><em>${n}/${N}</em></div>
    <div class="bar"><span style="width:${n/N*100}%;background:var(--pine)"></span></div></div>`;});
  const kid=codes.filter(c=>c.hh==="kids").length;
  if(kid)h+=`<p class="hint" style="margin-top:8px">${kid} of you would bring children, which puts
   school and hospital distance on the list.</p>`;}
 const skT=SKILLS.map(([k,a])=>({a,n:codes.filter(c=>c.sk&&c.sk[k]).length,
   who:codes.filter(c=>c.sk&&c.sk[k]).map(c=>c.n||"anon")})).sort((x,y)=>y.n-x.n);
 if(skT.some(x=>x.n)){h+=`${sec("What you bring")}
  <p class="hint">Covered ground and gaps. A gap is not a problem until you buy something that needs it.</p>`;
  skT.filter(x=>x.n).forEach(o=>h+=`<div class="res"${insAttr(o.a,o.who.map(nm=>{
    const i=codes.findIndex(c=>(c.n||"")===nm);return [nm,PAL[(i<0?0:i)%PAL.length],"can do this"];}))}><div class="t"><b>${o.a}</b>
    <em>${esc(o.who.join(", "))}</em></div>
    <div class="bar"><span style="width:${o.n/N*100}%;background:var(--pine)"></span></div></div>`);
  const gaps=skT.filter(x=>!x.n).map(x=>esc(x.a.toLowerCase()));
  if(gaps.length)h+=`<div class="card split"><div class="ct">Nobody has this yet</div>
    <p>${gaps.join(", ")}. Worth knowing before you need it.</p></div>`;}
 const whys=codes.filter(c=>c.wy&&c.wy.trim());
 if(whys.length){h+=sec("Why, in your own words");
  whys.forEach(c=>h+=`<div class="card"><div class="ct">${esc(c.n||"anon")}</div><p>${esc(c.wy)}</p></div>`);}
 const stops=codes.filter(c=>c.st&&c.st.trim());
 if(stops.length){h+=`${sec("What would stop you")}
  <p class="hint">Deal-breakers, in their own words. These outrank every preference on this page.</p>`;
  stops.forEach(c=>h+=`<div class="card split"><div class="ct">${esc(c.n||"anon")}</div><p>${esc(c.st)}</p></div>`);}
 const lows=[0,10,30,75,150],highs=[10,30,75,150,300];
 const said=codes.filter(c=>typeof c.cp==="number"&&c.cp<5);
 if(said.length){const lo=said.reduce((a,c)=>a+lows[c.cp],0),hi=said.reduce((a,c)=>a+highs[c.cp],0);
  h+=`<div class="res"><div class="t"><b>Pooled up-front capital</b><em>${said.length}/${N} answered</em></div>
   <p class="hint" style="margin:4px 0 0">Roughly &euro;${lo}k&ndash;${hi}k before borrowing. A house with land runs
   &euro;120k&ndash;1.2M depending on region, so this is ${hi<150?"early days":"a real start"}.</p></div>`;}
 const rl=[0,50,150,400],rh=[50,150,400,800];
 const rs=codes.filter(c=>typeof c.rn==="number"&&c.rn<4);
 if(rs.length){const lo=rs.reduce((a,c)=>a+rl[c.rn],0),hi=rs.reduce((a,c)=>a+rh[c.rn],0);
  h+=`<div class="res"><div class="t"><b>Pooled monthly</b><em>${rs.length}/${N} answered</em></div>
   <p class="hint" style="margin:4px 0 0">About &euro;${lo}&ndash;${hi} a month between you.</p></div>`;}
 const yes=codes.filter(c=>c.d==="Yes").length,mb=codes.filter(c=>c.d==="Maybe").length;
 h+=`<div class="res"><div class="t"><b>Would borrow</b><em>${yes} yes &middot; ${mb} maybe &middot; ${N-yes-mb} no</em></div></div>`;

 /* ---------- write-ins ---------- */
 const own={};
 codes.forEach(c=>(c.ow||[]).forEach(x=>{const k=String(x).toLowerCase().trim();if(!k)return;
  if(!own[k])own[k]={label:x,n:0,who:[]};own[k].n++;own[k].who.push(c.n||"anon");}));
 const ow=Object.values(own).sort((a,b)=>b.n-a.n);
 if(ow.length){h+=sec("Added by hand");
  ow.forEach(o=>h+=`<div class="res"><div class="t"><b>${esc(o.label)}</b><em>${esc(o.who.join(", "))}${o.n>1?` <span class="tag agree">${o.n} of you</span>`:""}</em></div></div>`);}

 h+=`<p class="foot">A picture of where you are, not a decision. With only ${N} of you, read the labels as
  prompts rather than findings.</p>
  <button class="btn noprint" id="png">Make a shareable image</button>
  <button class="btn ghost noprint" id="more">Add more codes</button>
  <button class="btn ghost noprint" id="shr2">Show the shared code</button>
  <button class="btn ghost noprint" id="hm">Home</button>
  <div id="sharebox" class="noprint"></div>
  <button id="totop" class="noprint" aria-label="Back to top">&uarr;</button>`;
 const navHTML=secList.length?`<div class="secnav noprint">${secList.map(s=>`<a href="#${s.id}">${s.label}</a>`).join("")}</div>`:"";
 app.innerHTML=h.replace("__RADAR__",window.__radar(null)).replace("__SECNAV__",navHTML);
 const pairsAllBtn=document.getElementById("pairsAll");
 if(pairsAllBtn)pairsAllBtn.onclick=()=>{document.getElementById("pairsBox").innerHTML=pairs.map(pairRow).join("");pairsAllBtn.remove();};
 const totop=document.getElementById("totop");
 if(totop)totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
 (function(){let act=null;
  document.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{
   const v=b.dataset.pp;
   act=(v==="all")?null:(act&&act.size===1&&act.has(+v))?null:new Set([+v]);
   document.getElementById("radarbox").innerHTML=window.__radar(act);wireInspector();
   document.querySelectorAll("[data-pp]").forEach(x=>{
    if(x.dataset.pp==="all")x.classList.toggle("on",act===null);
    else x.classList.toggle("on",act===null||act.has(+x.dataset.pp));});});})();
 document.getElementById("more").onclick=()=>{mode="combine";window.scrollTo(0,0);render();};
 POSTER={score:SCORE,verdict:verdict,names:codes.map((c,i)=>who(i)),
  sections:secScores.slice().sort((a,b)=>b[1]-a[1]).map(([l,v])=>[l,Math.round(v*100)]),
  locked:locked.slice(0,6).map(p=>p.label),fight:fight.slice(0,6).map(p=>p.label),
  regions:Object.entries(tally(rgOf)).sort((a,b)=>b[1]-a[1])
    .map(([r,n])=>r+" \u2014 "+n+(RETIRED.indexOf(r)>=0?" (earlier list)":""))
    .concat(codes.filter(c=>c.rw&&String(c.rw).trim())
      .map(c=>"\u201c"+String(c.rw).trim()+"\u201d \u2014 "+(c.n||"anon"))),
  pins:allPins(codes).map(x=>nameOf(x.i)+" \u2014 "+(subArea(x.p)||x.rg)),
  trial:(()=>{const t=codes.filter(c=>c.tr&&c.tr!==TRIAL[0][0]);
    if(!t.length)return [];
    return TRIAL.slice(1).map(([k,a])=>{const c2=codes.filter(c=>c.tr===k).length;
      return c2?a+" \u2014 "+c2:null;}).filter(Boolean);})(),
  stops:codes.filter(c=>c.st&&c.st.trim()).map(c=>(c.n||"anon")+": "+c.st)};
 wireInspector();
 const tip1=document.querySelector("#app .res[data-items]");
 if(tip1)tip1.classList.add("tip1");
 document.querySelectorAll(".qdot").forEach(d=>{const prev=d.onclick;
  d.onclick=ev=>{const q=window.__qp[+d.dataset.qi];
   if(q)document.getElementById("qcap").innerHTML=`<b>${esc(q.label)}</b> &mdash; ${q.want}% wanted, ${q.agree}% agreed
    &middot; <span style="color:${q.zone==="could be's"?"#7C2E3E":q.zone==="locked in"?"#35748A":"#22423A"}">${q.zone}</span>`;
   if(prev)prev.call(d,ev);};});
 document.getElementById("png").onclick=()=>{const b=document.getElementById("png");
  b.textContent="Drawing\u2026";
  makePoster((kind,src)=>{
   b.textContent="Make a shareable image";
   const box=document.getElementById("sharebox");
   box.innerHTML=`<p class="hint" style="margin:16px 0 8px"><b>Press and hold the image</b> to save it or send
    it straight to WhatsApp. On a laptop, right-click and Save image.</p>
    <img class="poster" src="${src}" alt="Where we stand \u2014 summary">
    <a class="btn ghost" href="${src}" download="where-we-stand.${kind}" target="_blank" rel="noopener">Open it full size</a>`;
   box.scrollIntoView({behavior:"smooth",block:"start"});});};
 document.getElementById("shr2").onclick=()=>{const pk=encode(codes);
  const box=document.getElementById("sharebox");
  box.innerHTML=`<p class="hint" style="margin:14px 0 6px">One code holding all ${N} answers. Anyone who pastes
   it into <b>Combine</b> sees this exact page. Sending it through a chat app is fine \u2014 the spaces below
   are ignored when it's pasted back in.</p>
   <div class="code" id="pk">${esc(grp(pk))}</div><button class="btn ghost" id="pkcp">Copy it</button>`;
  document.getElementById("pkcp").onclick=()=>{
   const el=document.getElementById("pk");
   try{navigator.clipboard.writeText(grp(pk)).then(()=>{document.getElementById("pkcp").textContent="Copied";},()=>{});}catch(e){}
   try{const r=document.createRange();r.selectNodeContents(el);
    getSelection().removeAllRanges();getSelection().addRange(r);}catch(e){}};
  box.scrollIntoView({behavior:"smooth",block:"nearest"});};
 upgradeMap(tally(rgOf));
 document.getElementById("hm").onclick=()=>{mode="home";render();};
}
/* open a shared link straight into that person's answers */
(function boot(){
 const m=location.hash.match(/#c=(.+)$/);
 if(m){try{const o0=decode(m[1]);
  if(Array.isArray(o0)&&o0.length>1){codes=o0;mode="result";render();return;}
  const o=Array.isArray(o0)?o0[0]:o0;
  S=stateFrom(o);
  window.__incoming=o; autosave(); mode="incoming"; render(); return;}catch(e){}}
 render();
})();
</script>
