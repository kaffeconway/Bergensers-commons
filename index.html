<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Eleven steps, saved as you go: stop anywhere and come back for your code later. Fifteen friends working out where to buy a place together in Europe.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kaffeconway.github.io/Bergensers-commons/">
<meta property="og:title" content="Build your commons">
<meta property="og:site_name" content="Bergensers Commons">
<meta property="og:description" content="Eleven steps, saved as you go: stop anywhere and come back for your code later. Fifteen friends working out where to buy a place together in Europe.">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Build your commons</title>
<style>
html{color-scheme:light;background:#EAEDE8;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{color-scheme:light only;
 --paper:#EAEDE8; --ink:#131E1B; --pine:#22423A; --glacier:#35748A; --madder:#7C2E3E;
 --gold:#8A6A2F; --rule:rgba(19,30,27,.16); --rule2:rgba(19,30,27,.07);
 /* --rule was doing two unrelated jobs. As the boundary of something you can tap it has to
    reach 3:1 (WCAG SC 1.4.11) and does not - 1.38:1 against the paper, with the button's own
    fill at 1.09:1, so nothing was really saying where a tappable area began. As a hairline
    between rows it is decorative and 1.4.11 does not govern it. Pushing the single token to
    the .48 that 3:1 needs would have taken every separator and card edge in the file with
    it, and traded the soft editorial feel for something much harder. So: --edge on controls
    only - .opt, .chip, inputs, textareas, buttons - and --rule left alone everywhere else. */
 /* .54, not the .48 that reaches 3:1 on its own: a border composites over the control's OWN
    fill before the page shows through it, so the figure that decides whether you can see
    where a control begins is the border against the paper OUTSIDE. At .48 that is 2.81:1 on
    a chip and 2.74:1 on a text input, which have different fills. .54 clears 3:1 on all of
    them. */
 --edge:rgba(19,30,27,.54);
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
#app{max-width:620px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.08;margin:0 0 6px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.15;margin:0 0 4px}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pine);opacity:.85;margin-bottom:14px}
.lede{font-size:16px;color:var(--pine);margin:0 0 20px}
.hint{font-size:13.5px;color:var(--pine);opacity:.8;margin:0 0 16px}
.note{background:rgba(53,116,138,.09);border-left:2px solid var(--glacier);padding:12px 14px;
 font-size:13.5px;line-height:1.5;margin:0 0 18px;border-radius:0 3px 3px 0}
.note b{font-weight:600}
.note .row{display:block;margin:11px 0 0}
.note .clim{display:block;margin:2px 0 0;font-size:12px;opacity:.82;line-height:1.45}
.note .cmp{opacity:.5}
.note .cmphead{display:block;margin:16px 0 2px;padding-top:11px;border-top:1px solid var(--rule);
 font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;opacity:.7}
.note .tail{display:block;margin:15px 0 0;padding-top:11px;border-top:1px solid var(--rule)}
.note .src{display:block;margin:9px 0 0;font-size:11px;opacity:.6;line-height:1.45}
.retired{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--rule);background:rgba(19,30,27,.035);
 border-radius:0 3px 3px 0;font-size:12.5px;color:var(--pine);opacity:.85;line-height:1.5}
.retired b{font-weight:600}
button{font-family:var(--sans);cursor:pointer;border-radius:3px;transition:.12s}
.btn{display:block;width:100%;padding:14px 16px;font-size:16px;background:var(--pine);color:var(--paper);border:none;margin-top:10px}
.btn:hover{background:#1a352e}
.btn.ghost{background:none;color:var(--pine);border:1px solid var(--edge)}
.btn.ghost:hover{border-color:var(--pine)}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;background:rgba(255,255,255,.5);
 border:1px solid var(--edge);color:var(--ink);font-size:15.5px;line-height:1.35}
.opt:hover{border-color:var(--pine)}
.opt.on{background:var(--pine);color:var(--paper);border-color:var(--pine)}
.opt small{display:block;font-size:12.5px;opacity:.75;margin-top:2px}
.tok{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2)}
.tok .lb{flex:1;font-size:15px}
.tok .lb small{display:block;font-size:12px;color:var(--pine);opacity:.7}
.tok .pips{font-family:var(--mono);font-size:13px;color:var(--glacier);min-width:60px;text-align:right;letter-spacing:1px}
.tok button{width:44px;height:44px;font-size:18px;background:none;border:1px solid var(--edge);color:var(--pine);line-height:1}
.tok button:disabled{opacity:.22;cursor:default}
.bank{position:sticky;top:0;background:var(--paper);padding:11px 0;font-family:var(--mono);font-size:12.5px;
 letter-spacing:.06em;color:var(--pine);border-bottom:1px solid var(--rule);z-index:5}
.bank b{color:var(--madder);font-size:15px}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--pine);
 opacity:.85;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* 44 in the touch dimension (Apple's bar, and WCAG 2.2 SC 2.5.5) without widening the
   grid: the extra height is padding, the row gap gives one pixel back. */
/* The glyph has to come out of the chip's own width or the grid loses rows to it. Tightened
   until the grid wraps into the same 23 rows it did before, so the only height this step
   gains is the 8px per row that the 44px target costs. */
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 9px 0 6px;font-size:14px;
 border:1px solid var(--edge);background:rgba(255,255,255,.5);color:var(--ink)}
/* Neutral and "nice to have" are 1.3:1 apart in greyscale, which is far under the 3:1 a
   state needs to be identifiable, so that distinction was carried by hue alone (WCAG
   SC 1.4.1). Deepening the fill enough to reach 3:1 would make "nice to have" look as
   committed as "essential", so the cue is the legend's own glyph, carried on the chip. */
.chip.plain{padding:0 9px}
.chip .g{font-family:var(--mono);font-size:13px;line-height:1;width:9px;flex:none;text-align:center}
.chip.nice{background:rgba(53,116,138,.16);border-color:var(--glacier)}
.chip.must{background:var(--glacier);border-color:var(--glacier);color:#fff}
/* Was opacity:.45 over the whole button, which took the label to 2.6:1 against its own
   background - a Level AA text failure. Recessive by border and strikethrough instead,
   with the label left at full strength. */
.chip.no{border-style:dashed;border-color:var(--madder);background:rgba(124,46,62,.06);color:var(--pine)}
.chip.no .l{text-decoration:line-through;text-decoration-color:var(--madder)}
/* Above the grid, not below it: the key that explains 34 controls is no use after them. */
.key{display:flex;gap:6px 14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--pine);
 opacity:.85;margin:0 0 12px}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{font-style:normal;width:10px;text-align:center;opacity:.85}
.sl{margin:16px 0 20px}
.sl label{display:block;font-size:15px;margin-bottom:2px}
/* The 44px range box centres a 16px track, so without this the end labels sat 32px below
   the track they describe and 20px above the next question's heading - the proximity
   grouping inverted. The target stays 44; the spacing comes back. */
.sl .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
 color:var(--pine);opacity:.7;margin-top:-10px}
/* The track draws at 16px, which is under the 24px AA floor (SC 2.5.8) for the one
   control on the step. The box is raised to 44 and the track centres inside it, so the
   thumb is unchanged and the reachable area is nearly three times the size. */
input[type=range]{width:100%;accent-color:var(--pine);height:44px;background:none;margin:0}
input[type=text],textarea{width:100%;padding:12px;font-size:16px;font-family:var(--sans);background:rgba(255,255,255,.7);
 border:1px solid var(--edge);border-radius:3px;color:var(--ink)}
textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical}
.dots{display:flex;gap:5px;margin-bottom:18px}
.dots i{height:3px;flex:1;background:var(--rule);border-radius:2px}
.dots i.on{background:var(--pine)}
.code{font-family:var(--mono);font-size:14px;word-break:break-all;background:rgba(255,255,255,.8);
 border:1px solid var(--glacier);padding:14px;border-radius:3px;margin:14px 0;line-height:1.6;
 user-select:all;-webkit-user-select:all}
.bar{height:8px;background:var(--rule2);border-radius:4px;overflow:hidden;display:flex;margin-top:5px}
.bar span{display:block;height:8px}
.res{padding:13px 0;border-bottom:1px solid var(--rule2)}
.res .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;overflow-wrap:anywhere}
.res .t b{font-weight:500;font-size:15.5px;overflow-wrap:anywhere}
.res .t em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--pine);opacity:.75;overflow-wrap:anywhere}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
 padding:2px 7px;border-radius:2px;margin-left:6px}
.tag.agree{background:rgba(34,66,58,.14);color:var(--pine)}
.tag.split{background:rgba(124,46,62,.14);color:var(--madder)}
.sec{margin:30px 0 10px;font-weight:400;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--pine);opacity:.8;padding-bottom:6px;border-bottom:1px solid var(--rule);scroll-margin-top:50px}
.who{font-family:var(--mono);font-size:11.5px;color:var(--pine);opacity:.8;margin-bottom:16px}
.secnav{position:sticky;top:0;z-index:4;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
 white-space:nowrap;background:var(--paper);padding:9px 0;margin:16px 0 6px;border-bottom:1px solid var(--rule)}
.secnav a{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--pine);
 text-decoration:none;padding:6px 11px;border:1px solid var(--edge);border-radius:20px;background:rgba(255,255,255,.6)}
.secnav a:active,.secnav a:hover{border-color:var(--pine)}
/* Sixteen chips in a strip 358px wide: fourteen of them are off-screen, so without a
   marker the nav cannot tell you where you are in twenty-odd screens of page. The current
   one is filled in, and scrolled into view, which also shows that the strip scrolls. */
.secnav a.on{background:var(--pine);color:var(--paper);border-color:var(--pine)}
/* Hidden until you are far enough down to want it. It used to be fully opaque at the top
   of the page, where it does nothing and sits on top of a row you might be reading. */
#totop{position:fixed;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;background:var(--pine);
 color:var(--paper);border:none;font-size:15px;box-shadow:0 2px 12px rgba(19,30,27,.28);z-index:50;
 opacity:0;pointer-events:none;transition:opacity .18s ease}
#totop.on{opacity:.92;pointer-events:auto}
#totop.on:hover{opacity:1}
/* Only the first inspectable row on the page carries the hint; repeating it under every
   row printed the same three words seventy times. */
.res.tip1::after{content:"tap for names";display:block;font-family:var(--mono);font-size:9.5px;
 letter-spacing:.08em;text-transform:uppercase;color:var(--glacier);opacity:.55;margin-top:5px}
.stepbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px 12px;margin-bottom:10px}
.stepbar .whois{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--pine);opacity:.75;
 display:flex;align-items:center;gap:8px;min-width:0}
.stepbar .whois b{font-weight:600;color:var(--ink);opacity:1;text-transform:none;letter-spacing:0;
 font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:11em}
.stepbar .whois .onboard{flex:none;padding:1px 6px;border:1px solid var(--rule);border-radius:2px;
 font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--glacier);opacity:.9}
/* 46x22 was at the WCAG 2.2 AA floor for a target (SC 2.5.8, 24x24) and the way out of
   the questionnaire is not the control to make hard to hit. The padding raises the hit
   area to 44 tall; the type is unchanged. */
.stepbar .exit{background:none;border:none;color:var(--pine);font-family:var(--mono);font-size:12px;
 letter-spacing:.04em;padding:0;min-height:44px;display:inline-flex;align-items:center;
 opacity:.75;cursor:pointer}
.stepbar .exit:hover{opacity:1;text-decoration:underline}
/* Underlined even at rest: beside the name in the same size and family, "Not you?" read
   as part of the name rather than as the way out. */
.stepbar .whois .exit{text-decoration:underline;text-decoration-color:var(--edge)}
.stepbar .stepno{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
 color:var(--pine);opacity:.8}
/* Every control on the page is a custom button, so the browser default ring is all a
   keyboard user has to go on. :focus-visible only, so a mouse or a tap shows nothing. */
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
/* The heading takes focus on every screen change, so the change is announced and a keyboard
   user starts from the top of the new screen rather than from the browser chrome. It is not
   a control and cannot be operated, so it gets no ring - and Chromium matches :focus-visible
   on it after a TAP but not after keyboard use, which is exactly the wrong way round. */
#app h1[tabindex],#app h2[tabindex]{outline:none}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.tok button:focus-visible{outline-offset:1px}
.err{color:var(--madder);font-size:13.5px;margin-top:8px}
.ok{color:var(--pine);font-size:13.5px;margin-top:8px}
.ok .lnk{background:none;border:none;padding:0;font:inherit;color:var(--glacier);
 text-decoration:underline;cursor:pointer}
.warn{background:rgba(124,46,62,.07);border-left:2px solid var(--madder);padding:11px 13px;
 margin:0 0 14px;border-radius:0 3px 3px 0;font-size:13.5px;line-height:1.45}
.foot{margin-top:26px;font-size:12.5px;color:var(--pine);opacity:.75;line-height:1.5}

/* Reference material that calibrates an answer but is not the question. Closed by default
   so the question is reachable first, and a <details> rather than a scripted toggle so it
   is readable, keyboard-operable and printable with no JavaScript at all - its content is
   in the DOM either way. */
.more{border:1px solid var(--rule);border-left:2px solid var(--glacier);border-radius:0 3px 3px 0;
 background:rgba(53,116,138,.06);margin:0 0 18px}
.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
 min-height:44px;padding:0 14px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--pine)}
.more>summary::-webkit-details-marker{display:none}
/* On the marker's own span, which is aria-hidden: generated content counts toward the
   accessible name, so the summary was announced as "plus what do these numbers mean". */
.more>summary .mk::before{content:"+";font-size:16px;line-height:1;text-align:center;opacity:.8}
.more>summary .mk{width:12px;flex:none;text-align:center}
/* A CSS string is not HTML: "&#8722;" would paint those seven characters over the summary
   label rather than a minus sign. CSS escapes with a backslash, and \2212 is just as ASCII
   as the entity is - the pure-ASCII rule needs the right escape for the language, not the
   same escape everywhere. */
.more[open]>summary .mk::before{content:"\2212"}
.more[open]>summary{border-bottom:1px solid var(--rule)}
.more>summary:hover{color:var(--ink)}
/* The note keeps its own inner typography (.row / .clim / .cmphead / .tail / .src) and
   gives up only its box, which the disclosure already draws. */
.more .note{margin:0;background:none;border-left:none;border-radius:0;padding:13px 14px 15px}

/* ---- check your answers ---- */
.rv{display:flex;width:100%;align-items:baseline;gap:10px;text-align:left;min-height:44px;
 padding:11px 0;margin:0;border:none;border-bottom:1px solid var(--rule2);background:none;
 color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;cursor:pointer}
.rv:hover{background:rgba(53,116,138,.05)}
.rv .rv2{flex:1;min-width:0;overflow-wrap:anywhere}
.rv .rk{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
 text-transform:uppercase;color:var(--pine);opacity:.8;margin-bottom:3px}
.rv .rs{display:block;font-size:12.5px;color:var(--pine);opacity:.85;margin-top:4px;line-height:1.45}
/* The row is a button with no border and no fill, so this word is the whole visual claim
   that it can be tapped - and it was at 2.45:1, with an underline that only appeared on
   hover. Underlined at rest instead, the same device the step bar's "Not you?" uses, and
   at full strength: --glacier tops out at 4.43:1, still under the 4.5:1 this size needs. */
.rv .rc{flex:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--pine);text-decoration:underline;text-decoration-color:var(--edge)}
.rv:hover .rc{text-decoration-color:var(--pine)}
/* A blank is an answer too. It is said, not omitted - and said quietly, so a page of them
   does not read as a page of errors. */
/* A blank is an answer too. It is said, not omitted - and said quietly by being italic,
   not by being faint: at opacity .6 this measured 3.26:1, and it is the value on most rows
   of a review somebody has not finished. */
.rv .no,.res .t b.no{color:var(--pine);font-style:italic;font-weight:400}

/* For text that has to reach a screen reader and nothing else - a token count that is drawn
   as pips, and the live region that announces a chip's new state on every tap. */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
 clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* Where this leaves us. Five lines, every one a count, at the top of a page that is
   otherwise twenty screens of charts. The respondent count leads it, because at four
   answers "Italian Alps 2" stated at the top of a page lends the number an authority the
   data cannot carry, and the page's own "read these as prompts rather than findings"
   caveat sits fifteen screens further down. */
.sum{margin:0 0 20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.sum .lede2{margin:12px 0 4px;font-size:14px;line-height:1.45;color:var(--pine)}
.sum .lede2 b{color:var(--ink);font-weight:600}
.sum .sr{display:flex;gap:11px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule2)}
.sum .sk{flex:none;width:74px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--pine);opacity:.8}
.sum .sv{flex:1;min-width:0;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.sum .sv b{font-weight:600}
.sum .sv em{font-style:normal;color:var(--pine);opacity:.85}
.card{border-left:2px solid var(--pine);background:rgba(255,255,255,.55);padding:11px 13px;margin:0 0 9px;border-radius:0 3px 3px 0}
.card.split{border-left-color:var(--madder)}
.card.agree{border-left-color:var(--glacier)}
.card .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
/* Deal-breakers, "why" lines, activity write-ins and the off-list write-in are quoted back
   whole, and somebody pasting a link into one of them laid the page out five times the
   width of the phone. "anywhere" only takes effect when there is no other break
   opportunity, so ordinary prose is unaffected. */
.card p{margin:0;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.board{border:1px solid var(--rule);border-radius:3px;background:rgba(255,255,255,.5);margin:0 0 14px;overflow:hidden}
.brow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule2)}
.brow:last-child{border-bottom:none}
.bn{flex:1;font-size:15px}
/* Removing a row is one tap and a row may be the only copy of what somebody sent, so the
   target for it is at least sized properly. The name beside it is now the main way into an
   edit, and was 32 tall. */
.brow .x{width:44px;height:44px;background:none;border:1px solid var(--edge);color:var(--madder);font-size:16px;line-height:1}
.brow .bedit{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
 background:none;border:none;padding:0;min-height:44px;text-align:left;color:var(--ink);font-size:15px;
 font-family:var(--sans);cursor:pointer}
.brow .bedit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bedit em{flex:none;font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--pine);opacity:.5}
.brow .bedit:hover em{opacity:1;text-decoration:underline}
.chartwrap{border:1px solid var(--rule);background:rgba(255,255,255,.45);border-radius:3px;padding:6px;margin:0 0 16px}
.pinbox{border:1px solid var(--rule);background:rgba(255,255,255,.5);border-radius:3px;
 padding:11px 12px 9px;margin:0 0 10px}
.pinbox .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.pinbox .ph b{font-size:14.5px;font-weight:600}
.pinbox .ph em{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.12em;
 text-transform:uppercase;color:var(--pine);opacity:.55}
.pinbox p.sub{margin:0 0 8px;font-size:12.5px;color:var(--pine);opacity:.8;line-height:1.45}
.pinmap{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation;
 background:rgba(255,255,255,.6);border:1px solid var(--rule2);border-radius:2px}

   role="img" aria-label="Tap to place a pin inside ${esc(rg)}">`;
 const stepLa=(win.la1-win.la0)>4?2:1, stepLo=(win.lo1-win.lo0)>6?2:1;
 for(let la=Math.ceil(win.la0);la<=win.la1;la+=stepLa){
  o+=`<line x1="${f.xy(la,win.lo0)[0].toFixed(1)}" y1="${f.xy(la,win.lo0)[1].toFixed(1)}"
   x2="${f.xy(la,win.lo1)[0].toFixed(1)}" y2="${f.xy(la,win.lo1)[1].toFixed(1)}"
   stroke="#131E1B" stroke-opacity=".07"/>`;}
 for(let lo=Math.ceil(win.lo0);lo<=win.lo1;lo+=stepLo){
  o+=`<line x1="${f.xy(win.la0,lo)[0].toFixed(1)}" y1="${f.xy(win.la0,lo)[1].toFixed(1)}"
   x2="${f.xy(win.la1,lo)[0].toFixed(1)}" y2="${f.xy(win.la1,lo)[1].toFixed(1)}"
   stroke="#131E1B" stroke-opacity=".07"/>`;}
 MAPGEO.forEach(ln=>{
  const runs=[];let cur=[];
  ln.forEach(pt=>{
   const [la,lo]=pt;
   const near=la>win.la0-1&&la<win.la1+1&&lo>win.lo0-1&&lo<win.lo1+1;
   const jump=cur.length&&(Math.abs(la-cur[cur.length-1][0])>1.2||Math.abs(lo-cur[cur.length-1][1])>1.2);
   if(!near||jump){if(cur.length>2)runs.push(cur);cur=near?[pt]:[];}
   else cur.push(pt);});
  if(cur.length>2)runs.push(cur);
  runs.forEach(seg=>{o+=`<polyline points="${seg.map(([la,lo])=>P(la,lo)).join(" ")}" fill="none"
   stroke="#131E1B" stroke-opacity=".3" stroke-width="1" stroke-linejoin="round"/>`;});});
 (RCTOWN[rg]||[]).forEach(([nm,la,lo])=>{
  if(la<win.la0||la>win.la1||lo<win.lo0||lo>win.lo1)return;
  const q=f.xy(la,lo), right=q[0]>PINW*0.68;
  o+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.2" fill="#131E1B" fill-opacity=".38"/>
   <text x="${(q[0]+(right?-5:5)).toFixed(1)}" y="${(q[1]+3).toFixed(1)}"
    text-anchor="${right?"end":"start"}" font-family="ui-monospace,monospace"
    font-size="8" fill="#22423A" opacity=".65">${esc(nm)}</text>`;});
 if(p){const q=f.xy(p[0],p[1]);
  o+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="13" fill="#7C2E3E" fill-opacity=".16"/>
   <circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5.5" fill="#7C2E3E"
    stroke="#EAEDE8" stroke-width="1.5"/>`;}
 return o+`</svg>`;
}
function pinPicker(rg){
 const p=(S.pin||{})[rg], area=subArea(p);
 const known=!!RCWIN[rg];
 return `<div class="pinbox">
  <div class="ph"><b>Roughly where in ${esc(PINLABEL[rg]||"Europe")}?</b><em>optional</em></div>
  <p class="sub">${known?`Tap the map. It only has to be roughly right &mdash; enough to tell one end
   of the region from the other, which the name alone cannot.`:`Tap the map if you have somewhere
   in mind. Towns are there to steer by, not as suggestions.`}</p>
  ${pinSVG(rg)}
  <div class="pf"><span>${p?`${area?`<b>${esc(area)}</b> &middot; `:""}${p[0].toFixed(2)}&#176;N,
    ${p[1].toFixed(2)}&#176;E`:`Nothing placed yet.`}</span>
   ${p?`<button data-pinclr="${esc(rg)}">Clear</button>`:""}</div></div>`;
}

/* ---------- steps ---------- */
const STEPS=[
{t:"Who's this?",k:"A first name, so the group can see whose is whose \u2014 and so you can come back and edit later.",
 r:()=>`<input type="text" id="nm" value="${esc(S.n)}" aria-label="Your first name"
   placeholder="First name" autocomplete="given-name">
  <p class="hint" style="margin-top:14px">${lsFailed?
   `This device is not letting the page save anything, so do this in one sitting and copy
    your code at the end.`:
   `Your answers save on this device under this name. Nothing is uploaded anywhere.`}</p>`,
 save:()=>setName(document.getElementById("nm").value)},

{t:"What shape is it?",k:"Not where \u2014 what kind of place. Pick the one closest to how you picture it.",
 r:()=>STYLES.map(([k,a,b])=>opt(S.style===k,"style",k,a,b)).join(""),
 save:()=>S.style?null:"Pick one."},

{t:"Spend your twenty",k:"Twenty tokens, eight things worth having. You cannot have them all \u2014 that's the point.",
 r:()=>`<div class="bank">Tokens left: <b id="left">${BANK-spent()}</b> of ${BANK}</div>`+
  SPEND.map(([k,a,b])=>`<div class="tok">
   <button data-sp="${esc(k)}" data-d="-1" data-fk="${esc("sp-"+k)}"
    aria-label="${esc("One less token on "+a)}" ${S.sp[k]<=0?"disabled":""}>&minus;</button>
   <div class="lb">${esc(a)}<small>${esc(b)}</small></div>
   <span class="pips" data-pips="${esc(k)}" aria-hidden="true">${"\u25CF".repeat(S.sp[k])||"\u00B7"}</span>
   <span class="vh" data-pipsv="${esc(k)}">${esc(a+": "+S.sp[k]+" of "+BANK)}</span>
   <button data-sp="${esc(k)}" data-d="1" data-fk="${esc("sp+"+k)}"
    aria-label="${esc("One more token on "+a)}" ${spent()>=BANK?"disabled":""}>+</button></div>`).join(""),
 save:()=>spent()===0?"Spend at least a few.":null},

{t:"What has to be possible?",k:"Tap once for nice to have, twice for essential. A third tap rules it out \u2014 only if you really mean it.",
 r:()=>`<div class="key">${ACTSTATE.map(([g,a])=>
    `<span><i aria-hidden="true">${g}</i>${esc(a)}</span>`).join("")}</div>`+
  ACTS.map(([g,items])=>`<div class="grp">${esc(g)}</div><div class="chips">`+
   items.map(([k,a])=>chipHTML(k,a)).join("")+`</div>`).join("")+
  `<p class="hint" style="margin-top:12px">Leaving something neutral is fine. Most people rule out very little.</p>
   <div class="grp">Something we've missed?</div>
   <textarea id="own" aria-label="Anything we have missed \u2014 one per line"
    placeholder="Add your own \u2014 one per line">${esc(S.ow||"")}</textarea>
   <p class="hint" style="margin-top:8px">These travel inside your code and show up in the group picture,
   so anything several of you add can go on the list properly next time.</p>`,
 save:()=>{grabOwn();return null;}},

{t:"How much can you take?",k:"Slide toward whichever end feels true.",
 r:()=>TOL.map(([k,a,lo,hi])=>`<div class="sl"><label for="tol-${esc(k)}">${esc(a)}</label>
   <input type="range" min="0" max="4" id="tol-${esc(k)}" value="${S.tol[k]}" data-tol="${esc(k)}"
    data-fk="${esc("tol:"+k)}" aria-valuetext="${esc(tolSay(lo,hi,S.tol[k]))}">
   <div class="ends"><span>${esc(lo)}</span><span>${esc(hi)}</span></div></div>`).join(""),
 save:()=>null},

{t:"How would you use it?",k:"Be honest rather than aspirational.",
 r:()=>`<p class="vh" id="q-use">How would you use it?</p>
   <div role="group" aria-labelledby="q-use">`+
  USES.map(([k,a])=>opt(S.use===k,"use",k,a)).join("")+
  `</div><p class="hint" id="q-hh" style="margin-top:20px"><b>Who would be coming with you?</b></p>
   <div role="group" aria-labelledby="q-hh">`+
  HOUSE.map(([k,a])=>opt(S.hh===k,"hh",k,a)).join("")+`</div>`+
  /* The reason for asking stays above the inputs: why somebody's personal data is wanted
     is not reference material and does not belong behind a disclosure, whatever it costs in
     fold. It is 30 words now instead of 85, which is the part that was actually wrong. */
  `<p class="hint" id="q-from" style="margin-top:22px"><b>And where are you coming from?</b>
   Which passport you hold and which country you live in decide what is legally possible.
   Both optional.</p>
   <div role="group" aria-labelledby="q-from">
   <div class="sl"><label for="cz">Passport, or passports</label>
    <input type="text" id="cz" maxlength="40" value="${esc(S.cz||"")}" placeholder="Norwegian"></div>
   <div class="sl"><label for="lv">Country you live in now</label>
    <input type="text" id="lv" maxlength="40" value="${esc(S.lv||"")}" placeholder="Netherlands"></div>
   </div>`,
 save:()=>{grabOwn();return S.use?(S.hh?null:"And who is coming with you?"):"Pick one.";}},

{t:"When, and what would stop you",k:"Timing splits groups more often than taste does.",
 r:()=>`<p class="hint" id="q-tr" style="margin:0 0 12px"><b>Renting together first.</b> Living somewhere
   together for a year before any money goes into land.</p>
   <div role="group" aria-labelledby="q-tr">`+
  TRIAL.map(([k,a,b])=>opt(S.tr===k,"tr",k,a,b)).join("")+`</div>`+
  `<details class="more" data-more="trial" ${moreOpen.trial?"open":""} style="margin-top:14px">
   <summary><span class="mk" aria-hidden="true"></span>Where this idea came from</summary><div class="note">It came out of the September call. It was
   the strongest proposal in the room and nobody has actually been asked about it, so this is the question
   doing the most work on this page.</div></details>
   <p class="hint" id="q-hz" style="margin-top:20px"><b>Realistically, when?</b></p>
   <div role="group" aria-labelledby="q-hz">`+
  HORIZON.map(([k,a])=>opt(S.hz===k,"hz",k,a)).join("")+`</div>`+
  `<p class="hint" style="margin-top:20px"><b>What would make you walk away?</b> One line. A job, a person,
   a place you cannot leave, a number you cannot reach. Deal-breakers are worth more than preferences.</p>
   <textarea id="stop" aria-label="What would make you walk away"
    placeholder="Nothing yet, or... ">${esc(S.stop||"")}</textarea>`,
 save:()=>{const q=document.getElementById("stop");if(q)S.stop=cut(q.value,240);
  return S.hz?null:"Pick a rough timeframe.";}},

{t:"Money, roughly",k:"Bands, not commitments. Rough prices and climate per region sit under the questions.",
 r:()=>`  <p class="hint" id="q-cap" style="margin-top:2px"><b>1. Up-front capital</b> \u2014 a one-time contribution
   toward buying and fixing the place.</p><div role="group" aria-labelledby="q-cap">`+
  bandBtns(CAP,CAPOFFER,CAPSPLIT,S.cap,"cap")+
  `</div><p class="hint" id="q-run" style="margin-top:18px"><b>2. Monthly running cost</b> \u2014 your share of
   insurance, heating, maintenance, tax, repairs. This continues forever, and it is what usually breaks
   these projects.</p><div role="group" aria-labelledby="q-run">`+
  bandBtns(RUN,RUNOFFER,RUNSPLIT,S.run,"run")+
  `</div><p class="hint" id="q-debt" style="margin-top:18px"><b>3. Would you borrow to take part?</b></p>
   <div role="group" aria-labelledby="q-debt">`+
  ["Yes","Maybe","No"].map(d=>opt(S.debt===d,"debt",d,d)).join("")+`</div>`+
  /* 417 of this step's 475 words used to stand between the person and the first control they
     could answer with. The content calibrates the answer and is worth keeping whole, so it
     moves rather than shrinks: a disclosure directly beneath the questions, closed to begin
     with, announced by the lede so nobody has to discover it. */
  `<details class="more" data-more="money" ${moreOpen.money?"open":""} style="margin-top:24px">
   <summary><span class="mk" aria-hidden="true"></span>What do these numbers mean?</summary><div class="note">Rough all-in cost of a house with some land, before
   renovation, and where each region's climate is heading. Orders of magnitude for calibration, not quotes,
   and the climate lines are direction of travel rather than forecasts.
   <span class="row"><b>Pyrenees</b> (Ari&egrave;ge, Hautes-Pyr&eacute;n&eacute;es) &middot; &euro;120&ndash;300k
    <span class="clim">Cheapest of the four per square metre &mdash; houses run about &euro;1,400/m&sup2; in
    Ari&egrave;ge. It also carries the strongest drying and heat signal of the four: about +1.2&#176;C in
    fifty years against 0.85&#176;C globally, half the glaciers gone, and less snow projected at every
    elevation.</span></span>
   <span class="row"><b>Italian Alps</b> &middot; &euro;100&ndash;450k in the western and eastern valleys,
    past &euro;600k in South Tyrol and the Dolomites
    <span class="clim">This region has to be narrowed before the number means anything. Piedmont and Friuli
    sit near &euro;1,600/m&sup2;; Trentino-Alto Adige averages about &euro;3,300/m&sup2;, but the province of
    Bolzano hit a record &euro;4,746/m&sup2; in August 2026 and the city is nearer &euro;4,900 &mdash; which
    puts the Dolomites in the same bracket as the German and Austrian Alps. Full alpine warming plus southern
    exposure, and water stress in the valleys.</span></span>
   <span class="row"><b>French Alps, Vercors &amp; Chartreuse</b> &middot; &euro;200&ndash;450k
    <span class="clim">Median around &euro;2,050/m&sup2; in the Vercors and &euro;2,210/m&sup2; in the
    Chartreuse. Full alpine warming: a rising snowline and drier summers, felt first at lower
    elevation.</span></span>
   <span class="row"><b>Vestland, Norway</b> &middot; &euro;215&ndash;520k
    <span class="clim">Building and renovation costs are the highest of the four. Wetter and milder, and the
    least exposed of the four to heat and drought &mdash; annual rainfall is projected up 5&ndash;30% by 2100
    and the growing season one to two months longer, with dark winters and a short season as the standing
    cost today.</span></span>
   <span class="cmphead">Not on the shortlist &middot; kept for comparison</span>
   <span class="row cmp"><b>Dolomites &amp; South Tyrol</b> &middot; &euro;600k and up
    <span class="clim">The expensive end of "Italian Alps", and the reason that name needs
    narrowing.</span></span>
   <span class="row cmp"><b>German &amp; Austrian northern Alps</b> &middot; &euro;600k&ndash;1.2M
    <span class="clim">Dropped on price in September. Houses in Tyrol average roughly &euro;4,800/m&sup2;.
    Left here because deleting the expensive end makes the other four look arbitrary.</span></span>
   <span class="tail">Renovation typically adds 30&ndash;100% on top &mdash; cheapest in France, dearest in
   Norway, where building costs are among Europe's highest. Take a mid-range example at &euro;500k all-in:
   five households means &euro;100k each, fifteen means &euro;33k each.</span>
   <span class="src">Prices: french-property.com, notaires de l'Is&egrave;re, immobiliare.it, idealista.it,
   ssb.no, Statistik Austria. Climate: CREA Mont-Blanc, Observatoire Pyr&eacute;n&eacute;en du Changement
   Climatique, Klima i Norge 2100.</span></div></details>`,
 save:()=>S.debt?null:"Answer the borrowing question too."},

{t:"What could you bring?",k:"Not what you own \u2014 what you can do. A commons runs on skills more than money.",
 r:()=>`<div class="chips">`+SKILLS.map(([k,a])=>
   `<button class="chip plain ${S.sk[k]?"must":""}" data-sk="${esc(k)}" data-fk="${esc("sk:"+k)}"
    aria-pressed="${S.sk[k]?"true":"false"}"><span class="l">${esc(a)}</span></button>`).join("")+`</div>
  `,
 save:()=>null},

{t:"Gut feeling on where",k:"Almost done. Pick up to two regions, without thinking too hard.",
 r:()=>{const stale=staleRg(),live=liveRg();
  return (stale.length?`<div class="note"><b>Your earlier ${stale.length>1?"picks have":"pick has"} gone from the list.</b>
    ${stale.map(x=>esc(x)).join(" and ")} ${stale.length>1?"are":"is"} not on the shortlist any more &mdash;
    the group narrowed to four regions on the September call, mostly on price. Choose again below;
    ${stale.length>1?"those picks":"that pick"} will not be carried into your code.</div>`:"")+
   REGIONS.map(p=>opt(live.indexOf(p)>=0,"rg",p,p)).join("")+
   (live.indexOf(OFFLIST)>=0?`<div class="sl" style="margin:10px 0 0">
     <label for="rgw"><b>Where were you thinking?</b></label>
     <input type="text" id="rgw" maxlength="60" value="${esc(S.rw||"")}" placeholder="Name the place">
     <p class="hint" style="margin:7px 0 0">Up to 60 characters. It travels inside your code, so the group
     can see what you had in mind.</p></div>`:"")+
   (live.length?`<div class="grp">Whereabouts, more precisely</div>
     <p class="hint" style="margin:0 0 10px">"Italian Alps" covers a third-of-the-price difference between
     its western and eastern ends, so a rough pin says more than the name does. Skip it if you have not
     got that far.</p>`+live.map(r=>pinPicker(r)).join(""):"");},
 save:()=>{grabOwn();
  /* Retired picks are kept only until the person has actually chosen again. Once they
     have a live pick, the warning has served its purpose and the stale one goes. */
  if(liveRg().length)S.rg=liveRg();
  return null;}},

{t:"Last one, and it's optional",k:"In one line: why do you want this at all?",
 r:()=>`<textarea id="why" aria-label="Why do you want this at all"
   placeholder="Because...">${esc(S.why||"")}</textarea>
   <details class="more" data-more="why" ${moreOpen.why?"open":""} style="margin-top:14px">
   <summary><span class="mk" aria-hidden="true"></span>Why this one is here</summary><div class="note">Nothing to do with the questions above
   \u2014 this one is about the whole idea. Skip it if you'd rather; nothing depends on it. If you do
   write something it gets quoted back to the group, and it tends to be the part people actually
   remember.</div></details>`,
 save:()=>{const w=document.getElementById("why");if(w)S.why=cut(w.value,180);return null;}}
];

/* ---------- render ---------- */
/* Every tap rebuilds the screen, which throws keyboard focus to the top of the document.
   The key is read off the active element before the rebuild and matched back afterwards;
   a key with nothing to match (a step change, a different screen) does nothing. */
function render(){markFocus();paint();restoreFocus();}
function paint(){
 if(mode==="home")return home();
 if(mode==="review")return review();
 if(mode==="done")return done();
 if(mode==="combine")return combine();
 if(mode==="result")return result();
 if(mode==="resume")return resume();
 if(mode==="incoming")return incoming();
 const st=STEPS[step], one=rvJump>=0;
 /* Opened from the review screen to change one thing: the step says so, and both buttons go
    back there rather than walking on through the other ten. */
 app.innerHTML=`<div class="stepbar"><button class="exit" id="exit">&larr; Home</button>
  ${step>0&&S.n?`<span class="whois"><b>${esc(S.n)}</b>
    ${boardEdit>=0?`<span class="onboard">on the board</span>`:""}
    <button class="exit" id="notyou">${boardEdit>=0?"Back to the board":"Not you?"}</button></span>`:""}
   <span class="stepno">${one?"Changing one answer":`Step ${step+1} of ${STEPS.length}`}</span></div>
  ${one?"":`<div class="dots">${STEPS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`}
  <h2>${st.t}</h2><p class="lede">${st.k}</p>${st.r()}
  <button class="btn" id="next">${one?"Save and go back":
    step===STEPS.length-1?"Check my answers":"Next"}</button>
  ${(step>0||one)?`<button class="btn ghost" id="back">${one?"Back to my answers":"Back"}</button>`:""}
  <div class="err" id="err" role="status" aria-live="polite"></div>`;
 wire();
}
function paintChip(b){
 const k=b.dataset.act, v=S.act[k]||0, lab=b.querySelector(".l");
 const name=lab?lab.textContent:k;
 b.className=("chip "+ACTCLASS[v]).replace(/\s+$/,"");
 const g=b.querySelector(".g"); if(g)g.textContent=ACTSTATE[v][0];
 /* The chip keeps focus through the repaint, and a change to the focused element's own
    accessible name is announced. say() as well said the same words twice on every tap. */
 b.setAttribute("aria-label",name+": "+ACTSTATE[v][1]);
}
function paintTokens(){
 const el=document.getElementById("left"); if(el)el.textContent=BANK-spent();
 const full=spent()>=BANK, was=document.activeElement;
 document.querySelectorAll("[data-sp]").forEach(b=>{
  const k=b.dataset.sp; b.disabled=(+b.dataset.d<0)?S.sp[k]<=0:full;});
 document.querySelectorAll("[data-pips]").forEach(x=>{
  x.textContent="\u25CF".repeat(S.sp[x.dataset.pips])||"\u00B7";});
 document.querySelectorAll("[data-pipsv]").forEach(x=>{
  const k=x.dataset.pipsv, t=SPEND.filter(y=>y[0]===k)[0];
  x.textContent=(t?t[1]:k)+": "+S.sp[k]+" of "+BANK;});
 /* A browser drops focus to the body when the focused control is disabled, so hand it to
    the one beside it rather than to nowhere. */
 if(was&&was.disabled&&was.dataset&&was.dataset.sp){
  const sib=document.querySelector('[data-sp="'+was.dataset.sp+'"][data-d="'+(+was.dataset.d<0?1:-1)+'"]');
  if(sib&&!sib.disabled)try{sib.focus({preventScroll:true});}catch(e){}}
}
function wire(){
 const q=(s,f)=>document.querySelectorAll(s).forEach(f);
 q("[data-more]",d=>d.ontoggle=()=>{moreOpen[d.dataset.more]=d.open;});
 q("[data-style]",b=>b.onclick=()=>{S.style=b.dataset.style;autosave();render();});
q("[data-use]",b=>b.onclick=()=>{S.use=b.dataset.use;autosave();render();});
 q("[data-hh]",b=>b.onclick=()=>{S.hh=b.dataset.hh;autosave();render();});
 /* aria-pressed already says which way a two-state toggle is, so no live message on top. */
 q("[data-sk]",b=>b.onclick=()=>{const k=b.dataset.sk;S.sk[k]=S.sk[k]?0:1;autosave();
   b.classList.toggle("must",!!S.sk[k]);b.setAttribute("aria-pressed",S.sk[k]?"true":"false");});
 q("[data-hz]",b=>b.onclick=()=>{const t=document.getElementById("stop");if(t)S.stop=cut(t.value,240);
   S.hz=b.dataset.hz;autosave();render();});
 q("[data-tr]",b=>b.onclick=()=>{const t=document.getElementById("stop");if(t)S.stop=cut(t.value,240);
   S.tr=b.dataset.tr;autosave();render();});
 q("[data-cap]",b=>b.onclick=()=>{S.cap=+b.dataset.cap;autosave();render();});
 q("[data-run]",b=>b.onclick=()=>{S.run=+b.dataset.run;autosave();render();});
 q("[data-debt]",b=>b.onclick=()=>{S.debt=b.dataset.debt;autosave();render();});
 q("[data-act]",b=>b.onclick=()=>{grabOwn();const k=b.dataset.act;S.act[k]=(S.act[k]+1)%4;autosave();paintChip(b);});
 q("[data-tol]",r=>r.oninput=()=>{const k=r.dataset.tol;S.tol[k]=+r.value;
   const t=TOL.filter(x=>x[0]===k)[0];
   if(t)r.setAttribute("aria-valuetext",tolSay(t[2],t[3],S.tol[k]));
   autosave();});
 q("[data-pinrg]",sv=>sv.onclick=ev=>{
   const rg=sv.dataset.pinrg, win=RCWIN[rg]||MAPWIN, f=insetFit(win);
   const box=sv.getBoundingClientRect(); if(!box.width)return;
   const sc=box.width/PINW;                       /* viewBox units per CSS pixel */
   const ll=f.inv((ev.clientX-box.left)/sc,(ev.clientY-box.top)/sc);
   grabOwn();
   if(!S.pin)S.pin={};
   S.pin[rg]=[Math.round(ll[0]*1e4)/1e4,Math.round(ll[1]*1e4)/1e4];

/* ---------- check your answers ----------
   GOV.UK's "check your answers", with its two hard rules kept: every answer is on it,
   including the ones left blank - a blank is information, so the line says "not answered"
   rather than disappearing - and every line is a tap back to the step that set it, returning
   here afterwards.

   It is built by DECODING the code that has just been written, never from live state. That
   makes it a round-trip check as well as a review: if the decode throws, or comes back
   saying something the person did not say, that is put on the screen rather than handed over
   as a code to send. */
let rvJump=-1;
/* Two bits holds exactly the four options these three questions offer, so there is no spare
   value for "not answered" and a blank is written as the first option. Only a C5 could fix
   that; until then the screen says it out loud. */
const RVGUESS=[["u",USES,"How would you use it",5],["hh",HOUSE,"Who would be coming with you",5],
 ["hz",HORIZON,"Realistically, when",6]];
const RVREQ=[["n","First name",0],["s","What shape is it",1],["u","How would you use it",5],
 ["hh","Who would be coming with you",5],["hz","Realistically, when",6],["d","Would you borrow",7]];
const labOf=(list,k)=>{const x=list.filter(y=>y[0]===k)[0];return x?x[1]:"";};
const NOANS='<span class="no">not answered</span>';
/* Four answers start on a value that is also an option somebody can pick on purpose:
   capital on "Rather not say", monthly on "Not sure yet", the trial year on "No view yet"
   and every tolerance in the middle. The record cannot tell a choice from an untouched
   default, so the line says so - but only when the value is the ambiguous one, or it would
   be a caveat on a page of answers that do not need one. */
const RVLEFT="This is where the question starts, so it may mean it was left there.";
/* The two bands that were split stay in the arrays so older codes still decode to exactly
   what the person said, and they are shown marked wherever they appear - on the form, on
   the results page, and here. Never silently, and never moved into a band nobody picked. */
const RVSPLIT="This band has since been split \u2014 tap to say which half.";
/* Nothing was chosen, and unlike the four above, a code has no way to carry that: four
   options in two bits leaves no spare value, so it writes the first one. The note at the
   top of the screen says so once; the row says it where the answer is. */
const RVMADE="Not chosen \u2014 a code cannot carry a blank here, so it says this.";
/* Everything that reaches the markup is escaped here, once, so no caller can forget. */
function rvRow(key,jump,plain,sub){
 const has=plain!==undefined&&plain!==null&&String(plain)!=="";
 /* The name has to carry the sub-line too. aria-label replaces the entire subtree, so a
    note that is only in the markup reaches sighted readers and nobody else - and on this
    screen the notes are the part that says an answer was invented, or that a band has been
    split since. data-fk is here so returning from a jumped step lands back on this row. */
 return `<button class="rv" data-jump="${jump}" data-fk="${esc("rv:"+jump)}"
  aria-label="${esc("Change "+key+". "+(has?String(plain):"Not answered")+"."+(sub?" "+sub:""))}">
  <span class="rv2"><span class="rk">${esc(key)}</span>${has?esc(plain):NOANS}${
   sub?`<span class="rs">${esc(sub)}</span>`:""}</span>
  <span class="rc" aria-hidden="true">change</span></button>`;
}
/* What counts as a mismatch, and what does not. Several fields legitimately come back
   changed and comparing them flat would cry wolf on every single code: regions are stored in
   REGIONS order, capped at two and without any retired pick; pins are quantised to about
   four kilometres and only written for the regions actually picked; and the free text was
   already cut to length by payload() before it was encoded. Each is therefore compared the
   way it is actually stored. Everything else is compared flat, and a difference there is a
   real one. */
function rvCheck(p,d){
 const out=[], eq=(a,b)=>String(a==null?"":a)===String(b==null?"":b);
 /* A formatter that clamps - tolSay does - can render two different stored values as the
    same words, and an alarm whose two sides read identically is not something anybody can
    act on. When that happens the raw values are shown beside them. */
 const add=(lab,mine,theirs,jump,rawA,rawB)=>{
  let m=mine,t=theirs;
  if(String(m)===String(t)&&rawA!==undefined){m=m+" ["+rawA+"]";t=t+" ["+rawB+"]";}
  out.push({lab:lab,mine:m,theirs:t,jump:jump});};
 const none="not answered";
 if(!eq(p.n,d.n))add("First name",p.n||none,d.n||none,0);
 if(!eq(p.s,d.s))add("What shape is it",labOf(STYLES,p.s)||none,labOf(STYLES,d.s)||none,1);
 /* These three have no spare bit value for "not answered", so an unanswered one always
    comes back as the first option. That is not a fault in the code and it is already said,
    quietly and by name, in the "no answer yet" note - raising the alarm box for it as well
    would put a red panel in front of everybody who simply has not finished. A real
    disagreement, where the question WAS answered and the code says otherwise, still fires. */
 if(p.u&&!eq(p.u,d.u))add("How would you use it",labOf(USES,p.u)||none,labOf(USES,d.u)||none,5);
 if(p.hh&&!eq(p.hh,d.hh))add("Who would be coming",labOf(HOUSE,p.hh)||none,labOf(HOUSE,d.hh)||none,5);
 if(p.hz&&!eq(p.hz,d.hz))add("Realistically, when",labOf(HORIZON,p.hz)||none,labOf(HORIZON,d.hz)||none,6);
 if(!eq(p.tr,d.tr))add("Renting together first",labOf(TRIAL,p.tr)||none,labOf(TRIAL,d.tr)||none,6);
 if(!eq(p.d,d.d))add("Would you borrow",p.d||none,d.d||none,7);
 if(p.cp!==d.cp)add("Up-front capital",CAP[p.cp]||none,CAP[d.cp]||none,7);
 if(p.rn!==d.rn)add("Monthly running cost",RUN[p.rn]||none,RUN[d.rn]||none,7);
 SPEND.forEach(([k,a])=>{const x=(p.sp&&p.sp[k])||0,y=(d.sp&&d.sp[k])||0;
  if(x!==y)add("Tokens on "+a,String(x),String(y),2);});
 ALLACTS.forEach(([k,a])=>{const x=(p.a&&p.a[k])||0,y=(d.a&&d.a[k])||0;
  if(x!==y)add(a,ACTSTATE[x][1],ACTSTATE[y][1],3);});
 TOL.forEach(([k,a,lo,hi])=>{const x=(p.t&&p.t[k]!==undefined)?p.t[k]:2,
   y=(d.t&&d.t[k]!==undefined)?d.t[k]:2;
  if(x!==y)add(a,tolSay(lo,hi,x),tolSay(lo,hi,y),4,x,y);});
 SKILLS.forEach(([k,a])=>{const x=(p.sk&&p.sk[k])?1:0,y=(d.sk&&d.sk[k])?1:0;
  if(x!==y)add(a,x?"offered":"not offered",y?"offered":"not offered",8);});
 [["st","What would make you walk away",6],["wy","Why you want this",10],
  ["rw","Where you were thinking",9],["cz","Passport",5],["lv","Country you live in",5]]
  .forEach(([k,lab,j])=>{if(!eq(p[k],d[k]))add(lab,p[k]||"nothing",d[k]||"nothing",j);});
 const want=rgPicks(p), got=(d.rg||[]).slice();
 if(want.join("|")!==got.join("|"))
  add("Where",want.length?want.join(", "):"nothing picked",got.length?got.join(", "):"nothing picked",9);
 const ow1=(p.ow||[]).join(" / "), ow2=(d.ow||[]).join(" / ");
 if(ow1!==ow2)add("Anything you added",ow1||"nothing",ow2||"nothing",3);
 want.forEach(rg=>{const a=(p.pn||{})[rg], b=(d.pn||{})[rg];
  if(!a&&!b)return;
  if(!a||!b){add("Pin in "+(SHORT[rg]||rg),a?"placed":"none placed",b?"placed":"none placed",9);return;}
  /* the quantisation is about 4 km a step, so anything under 6 km apart is the storage */
  if(kmApart(a,b)>6)add("Pin in "+(SHORT[rg]||rg),a[0].toFixed(2)+", "+a[1].toFixed(2),
    b[0].toFixed(2)+", "+b[1].toFixed(2),9);});
 return out;
}
function review(){

 const spTot=sp.reduce((a,x)=>a+x.v,0);

 ALLACTS.forEach(([k,a])=>byState[Math.min(3,(r.a&&r.a[k])||0)].push(a));
